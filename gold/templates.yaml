  # =====================================================================================
  # WHY / FORECAST: judged by rubric (rules section 10). `facts` are reference queries for the
  # numbers an answer is likely to quote; any number given must match them.
  # =====================================================================================

  - id: W01
    split: why_forecast
    source: plan
    types: [time_intelligence]
    question: "Why did our sales drop last month?"
    franchises: [ICLA, ICCH]
    answer_shape: rubric
    rubric:
      - "states the actual change between the two months in dollars and percent, and corrects the premise if sales did not drop"
      - "breaks the change down with data (sold count vs average sale, or designers / lead sources), without speculating about causes the data does not show"
      - "does not blame a person"
      - "any number given matches the facts (franchise sales basis)"
    facts:
      - label: sold amount and count, last month and the month before (franchise basis)
        periods: {a: last_month, b: two_months_ago}
        result_columns: [Sold Amount Last Month, Sold Count Last Month, Sold Amount Month Before, Sold Count Month Before]
        col_types: {Sold Amount Last Month: currency, Sold Count Last Month: count, Sold Amount Month Before: currency, Sold Count Month Before: count}
        reference_sql: |
          SELECT SUM(CASE WHEN {sales_date_sql} >= '{a.d0}' AND {sales_date_sql} < '{a.d1_next}' THEN `Amount` END) AS `Sold Amount Last Month`,
                 SUM({sales_date_sql} >= '{a.d0}' AND {sales_date_sql} < '{a.d1_next}') AS `Sold Count Last Month`,
                 SUM(CASE WHEN {sales_date_sql} >= '{b.d0}' AND {sales_date_sql} < '{b.d1_next}' THEN `Amount` END) AS `Sold Amount Month Before`,
                 SUM({sales_date_sql} >= '{b.d0}' AND {sales_date_sql} < '{b.d1_next}') AS `Sold Count Month Before`
          FROM Salesforce_Data WHERE `Revised Stage` = 'Sold'
        reference_dax: |
          EVALUATE
          ROW(
            "Sold Amount Last Month", CALCULATE([Revenue Sold], DATESBETWEEN({sales_cal_dax}[Date], {a.d0_dax}, {a.d1_dax})),
            "Sold Count Last Month", CALCULATE([Count Sold], DATESBETWEEN({sales_cal_dax}[Date], {a.d0_dax}, {a.d1_dax})),
            "Sold Amount Month Before", CALCULATE([Revenue Sold], DATESBETWEEN({sales_cal_dax}[Date], {b.d0_dax}, {b.d1_dax})),
            "Sold Count Month Before", CALCULATE([Count Sold], DATESBETWEEN({sales_cal_dax}[Date], {b.d0_dax}, {b.d1_dax}))
          )

  - id: W02
    split: why_forecast
    source: plan
    types: []
    question: "What will we sell next quarter?"
    franchises: [ICAU]
    answer_shape: rubric
    rubric:
      - "does not give a confident prediction; any projection is labelled a simple extrapolation with its assumption stated"
      - "gives relevant history: the same quarter last year and/or the recent trend, and the open Proposed pipeline"
      - "any number given matches the facts"
    facts:
      - label: sold in the same quarter of this year (Q1) and the open pipeline
        periods: {q: q1_this_year}
        result_columns: [Sold Amount Q1, Open Proposals, Open Pipeline]
        col_types: {Sold Amount Q1: currency, Open Proposals: count, Open Pipeline: currency}
        reference_sql: |
          SELECT (SELECT SUM(`Amount`) FROM Salesforce_Data WHERE `Revised Stage` = 'Sold'
                    AND {sales_date_sql} >= '{q.d0}' AND {sales_date_sql} < '{q.d1_next}') AS `Sold Amount Q1`,
                 (SELECT COUNT(*) FROM Salesforce_Data WHERE `Revised Stage` = 'Proposed') AS `Open Proposals`,
                 (SELECT SUM(`Amount`) FROM Salesforce_Data WHERE `Revised Stage` = 'Proposed') AS `Open Pipeline`
        reference_dax: |
          EVALUATE
          ROW(
            "Sold Amount Q1", CALCULATE([Revenue Sold], DATESBETWEEN({sales_cal_dax}[Date], {q.d0_dax}, {q.d1_dax})),
            "Open Proposals", [Count Proposed],
            "Open Pipeline", [Revenue Proposed]
          )

  - id: W03
    split: why_forecast
    source: prodlog
    types: [sold_vs_created]
    question: "Based on {designer}'s sales so far this year, what will they have sold by the end of the year?"
