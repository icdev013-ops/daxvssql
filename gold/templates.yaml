             SUM(CASE WHEN `Created Date` >= '{d0}' AND `Created Date` < '{d1_next}' THEN `Amount` END) AS `Sold Amount by Created Date`,
             SUM(CASE WHEN `Created Date` >= '{d0}' AND `Created Date` < '{d1_next}' THEN 1 ELSE 0 END) AS `Sold Count by Created Date`
