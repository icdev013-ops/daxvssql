        reference_sql: |
          SELECT 100 * SUM(`Lead Status` = 'Moved to Studio') / COUNT(*) AS `Conversion %`, SUM(`Lead Status` = 'Moved to Studio') AS `Moved to Studio`, COUNT(*) AS `Leads`
          FROM Leads WHERE `Lead Created Date` >= '{d0}' AND `Lead Created Date` < '{d1_next}'
        reference_dax: |
          EVALUATE CALCULATETABLE(ROW("Conversion %", 100 * [Lead Conversion Rate], "Moved to Studio", [Converted Lead Count], "Leads", [Total Lead Count]),
                                  DATESBETWEEN(DateTable[Date], {d0_dax}, {d1_dax}))
      - label: lead-journey win rate (sold / journey leads), leads created this year
        period: ytd
        result_columns: [Win %, Sold, Journey Leads]
        col_types: {Win %: percent, Sold: count, Journey Leads: count}
        reference_sql: |
          SELECT 100 * SUM(m.`Journey Outcome` = 'Sold') / COUNT(*) AS `Win %`, SUM(m.`Journey Outcome` = 'Sold') AS `Sold`, COUNT(*) AS `Journey Leads`
          FROM `Lead Milestones` m JOIN Leads l ON l.`Lead ID` = m.`Lead ID`
          WHERE m.`Exclude From Journey` = 0 AND l.`Lead Created Date` >= '{d0}' AND l.`Lead Created Date` < '{d1_next}'
        reference_dax: |
          EVALUATE CALCULATETABLE(ROW("Win %", 100 * [JN Win %], "Sold", [JN Sold], "Journey Leads", [JN Leads]), DATESBETWEEN(DateTable[Date], {d0_dax}, {d1_dax}))
