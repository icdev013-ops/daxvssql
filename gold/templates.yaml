  - &T131
    id: T131
    split: test
    source: e2e170:Q036
    types: [time_intelligence]
    question: "How does our lead count this year compare with the same period last year?"
    franchises: [ICLA, ICCH, ICAU]
    period: ytd
    periods: {prev: last_year_ytd}
    date_basis: lead_created
    answer_shape: number
    result_columns: [Leads This Year, Leads Same Period Last Year, Change %]
    col_types: {Leads This Year: count, Leads Same Period Last Year: count, Change %: percent}
    headline: [Leads This Year, Leads Same Period Last Year]
    reference_sql: |
      SELECT t.ty AS `Leads This Year`, t.ly AS `Leads Same Period Last Year`, 100 * (t.ty - t.ly) / t.ly AS `Change %`
      FROM (SELECT SUM(`Lead Created Date` >= '{d0}' AND `Lead Created Date` < '{d1_next}') AS ty,
                   SUM(`Lead Created Date` >= '{prev.d0}' AND `Lead Created Date` < '{prev.d1_next}') AS ly
            FROM Leads) t
    reference_dax: |
      EVALUATE
      VAR _ty = CALCULATE([Total Lead Count], DATESBETWEEN(DateTable[Date], {d0_dax}, {d1_dax}))
      VAR _ly = CALCULATE([Total Lead Count], DATESBETWEEN(DateTable[Date], {prev.d0_dax}, {prev.d1_dax}))
      RETURN ROW("Leads This Year", _ty, "Leads Same Period Last Year", _ly, "Change %", 100 * DIVIDE(_ty - _ly, _ly))

