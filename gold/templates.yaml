  - id: T103
    split: test
    source: fresh
    types: [cohort_funnel, ranking]
    question: "Which channel's leads from this year are winning most often? Only channels with at least 30 leads."
    franchises: [ICLA, ICAU]
    period: ytd
    date_basis: lead_created
    answer_shape: ranked_list
    result_columns: [Lead Source Channel, Win %, Sold, Leads]
    col_types: {Lead Source Channel: text, Win %: percent, Sold: count, Leads: count}
    label_column: Lead Source Channel
    value_columns: [Win %]
    top_k: 3
    order_by: {column: Win %, direction: desc, ties: either order accepted}
    reference_sql: |
      SELECT l.`Lead Source Channel`, 100 * SUM(m.`Journey Outcome` = 'Sold') / COUNT(*) AS `Win %`,
             SUM(m.`Journey Outcome` = 'Sold') AS `Sold`, COUNT(*) AS `Leads`
      FROM `Lead Milestones` m JOIN Leads l ON l.`Lead ID` = m.`Lead ID`
      WHERE m.`Exclude From Journey` = 0 AND l.`Lead Created Date` >= '{d0}' AND l.`Lead Created Date` < '{d1_next}'
        AND l.`Lead Source Channel` IS NOT NULL AND l.`Lead Source Channel` <> ''
      GROUP BY l.`Lead Source Channel`
      HAVING COUNT(*) >= 30
      ORDER BY `Win %` DESC, `Leads` DESC, l.`Lead Source Channel`
    reference_dax: |
      EVALUATE
      SELECTCOLUMNS(
        FILTER(
          SUMMARIZECOLUMNS(Leads[Lead Source Channel], DATESBETWEEN(DateTable[Date], {d0_dax}, {d1_dax}),
                           "@l", [JN Leads], "@s", [JN Sold]),
          [@l] >= 30 && Leads[Lead Source Channel] <> ""
        ),
        "Lead Source Channel", Leads[Lead Source Channel], "Win %", 100 * DIVIDE([@s], [@l]), "Sold", [@s], "Leads", [@l]
      )
      ORDER BY [Win %] DESC, [Leads] DESC, [Lead Source Channel]

