             SUM(CASE WHEN `Revised Stage` = 'Sold' THEN `Amount` END) AS `Sold Amount`, SUM(`Amount`) AS `Total Value`
      FROM Salesforce_Data WHERE `Created Date` >= '{d0}' AND `Created Date` < '{d1_next}'
    reference_dax: |
