  # =====================================================================================
  # TEST (decides the outcome). Each template runs on 2-3 franchises. Intents that Dev already
  # covers on a franchise are not repeated on that franchise (Dev is the example pool).
  # source: fresh = written for this gold set without looking at any bot output;
  # e2e170:Qnnn / prodlog / recipe:ID = rephrased from that source.
  # =====================================================================================

  # ---------------------------------------------------------------- sales, basis, time

  - &T001
    id: T001
