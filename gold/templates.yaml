      EVALUATE
      SELECTCOLUMNS(
        CALCULATETABLE(Appointments, {appt_rule_dax},
                       KEEPFILTERS(Appointments[Appointment Start Time] >= {d0_dax}),
                       KEEPFILTERS(Appointments[Appointment Start Time] < {d1_next_dax})),
        "Subject", Appointments[Appointment Subject], "Staff Member", Appointments[Assigned Staff Member], "Activity Type", Appointments[Activity Type]
      )
      ORDER BY [Subject], [Staff Member]
    notes: "Future bookings under the franchise's appointment rule. Bookings change during the day, so this case is drift-prone."

  - id: T052
    split: test
    source: fresh
    types: [row_level_list, appointments_rules]
    question: "Which projects did {staff} meet with last month?"
    franchises: [ICLA, ICCH]
    params:
      staff:
        description: "staff member with the most appointments last month under the franchise rule that are tied to a project"
        param_sql: |
          SELECT `Assigned Staff Member` FROM Appointments
          WHERE {appt_rule_sql} AND `Appointment Start Time` >= '{d0}' AND `Appointment Start Time` < '{d1_next}'
            AND `Project Name` IS NOT NULL AND `Project Name` <> '' AND `Assigned Staff Member` IS NOT NULL
          GROUP BY `Assigned Staff Member`
          ORDER BY COUNT(DISTINCT `Project Name`) DESC, `Assigned Staff Member` LIMIT 1
    period: last_month
    date_basis: appointment_start
    answer_shape: table
    result_columns: [Project Name, Appointments]
    col_types: {Project Name: text, Appointments: count}
    label_column: Project Name
    value_columns: [Appointments]
    reference_sql: |
      SELECT `Project Name`, COUNT(*) AS `Appointments`
      FROM Appointments
      WHERE {appt_rule_sql} AND `Assigned Staff Member` = {staff|sql}
        AND `Appointment Start Time` >= '{d0}' AND `Appointment Start Time` < '{d1_next}'
        AND `Project Name` IS NOT NULL AND `Project Name` <> ''
      GROUP BY `Project Name`
      ORDER BY `Appointments` DESC, `Project Name`
    reference_dax: |
      EVALUATE
      VAR _t =
        ADDCOLUMNS(
          VALUES(Appointments[Project Name]),
          "@n", CALCULATE([Total Activity Count], {appt_rule_dax}, Appointments[Assigned Staff Member] = {staff|dax},
                          KEEPFILTERS(Appointments[Appointment Start Time] >= {d0_dax}),
                          KEEPFILTERS(Appointments[Appointment Start Time] < {d1_next_dax}))
        )
      RETURN
        SELECTCOLUMNS(FILTER(_t, NOT ISBLANK([@n]) && Appointments[Project Name] <> ""),
                      "Project Name", Appointments[Project Name], "Appointments", [@n])
      ORDER BY [Appointments] DESC, [Project Name]
    notes: "Projects on the staff member's appointments last month (franchise appointment rule), with how many appointments each."

  - &T053
    id: T053
