# Gold question set for the DAX vs SQL chatbot POC (see PREREGISTRATION.md and gold/README.md).
#
# Every case is a template x franchise. References are QUERIES, never stored numbers: the scorer
# re-runs reference_sql on the sandbox views (Route B) and reference_dax on the dataset (Route A)
# right after each answer. Tokens in {braces} are resolved at run time by gold/validate.py:
#   periods  {d0} {d1} {d1_next} (inclusive start, inclusive end, exclusive end, YYYY-MM-DD)
#            {d0_dax} {d1_dax} {d1_next_dax} (DATE(y, m, d)), {year}, {mname}; a template's extra
#            periods are prefixed, e.g. {prev.d0}
#   macros   per-franchise rules below (sales date basis, appointment rules)
#   params   {name} raw, {name|sql} SQL literal, {name|dax} DAX literal, {name|first} first word
# No person names, customer data or result numbers belong in this file (the repo is public).
# Percentages are 0-100 in BOTH references. Result columns come back in result_columns order.

version: 1
anchor_default: 2026-11-07
franchises: [ICLA, ICCH, ICAU]

macros:
  # Sales date basis (decided 2026-11-07): ICLA on created date, ICCH and ICAU on sold date.
  # Lost, Dead Lead and Proposed always use created date.
  sales_basis:     {ICLA: created date, ICCH: sold date, ICAU: sold date}
  other_basis:     {ICLA: sold date, ICCH: created date, ICAU: created date}
  sales_date_sql:  {ICLA: "`Created Date`", ICCH: "`Original Project Sold Date`", ICAU: "`Original Project Sold Date`"}
  other_date_sql:  {ICLA: "`Original Project Sold Date`", ICCH: "`Created Date`", ICAU: "`Created Date`"}
  sales_date_dax:  {ICLA: "Salesforce_Data[Created Date]", ICCH: "Salesforce_Data[Original Project Sold Date]", ICAU: "Salesforce_Data[Original Project Sold Date]"}
  other_date_dax:  {ICLA: "Salesforce_Data[Original Project Sold Date]", ICCH: "Salesforce_Data[Created Date]", ICAU: "Salesforce_Data[Created Date]"}
  sales_cal_dax:   {ICLA: DateTable, ICCH: SoldDateTable, ICAU: SoldDateTable}
  other_cal_dax:   {ICLA: SoldDateTable, ICCH: DateTable, ICAU: DateTable}

  # Appointments as each franchise's report pages count them (page filters, Appointments tabs):
  #   ICLA  first design appointments: Activity Type not Installation/Unspecified, subject contains
  #         "1st" and not "Cancelled", the page's office-staff exclusion list (resolved at run time from
  #         the report page JSON, never stored here), Appointment Start Time on or after 2025-06-01
  #   ICCH  subject does not contain "available"
  #   ICAU  every calendar entry
  # Blank values pass a NOT filter in DAX, so the SQL side COALESCEs before NOT IN / NOT LIKE.
  appt_rule_label: {ICLA: first design appointments (LA report rule), ICCH: "appointments excluding 'available' holds (Chicago report rule)", ICAU: all calendar entries (Austin report rule)}
  appt_rule_sql:
    ICLA: "COALESCE(`Activity Type`, '') NOT IN ('Installation', 'Unspecified') AND `Appointment Subject` LIKE '%1st%' AND `Appointment Subject` NOT LIKE '%Cancelled%' AND COALESCE(`Assigned Staff Member`, '') NOT IN ({ICLA_STAFF_SQL}) AND `Appointment Start Time` >= '2025-06-01'"
    ICCH: "COALESCE(`Appointment Subject`, '') NOT LIKE '%available%'"
    ICAU: "1 = 1"
  # comma-separated CALCULATE / CALCULATETABLE filter arguments (KEEPFILTERS: the rule only narrows)
  appt_rule_dax:
    ICLA: 'KEEPFILTERS(NOT Appointments[Activity Type] IN {"Installation", "Unspecified"}), KEEPFILTERS(CONTAINSSTRING(Appointments[Appointment Subject], "1st")), KEEPFILTERS(NOT CONTAINSSTRING(Appointments[Appointment Subject], "Cancelled")), KEEPFILTERS(NOT Appointments[Assigned Staff Member] IN {{ICLA_STAFF_DAX}}), KEEPFILTERS(Appointments[Appointment Start Time] >= DATE(2025, 6, 1))'
    ICCH: 'KEEPFILTERS(NOT CONTAINSSTRING(Appointments[Appointment Subject], "available"))'
    ICAU: 'KEEPFILTERS(Appointments[entity] = "ICAU")'
  # the same rule as a row predicate, for FILTER(Appointments, ...)
  appt_rule_pred_dax:
    ICLA: 'NOT Appointments[Activity Type] IN {"Installation", "Unspecified"} && CONTAINSSTRING(Appointments[Appointment Subject], "1st") && NOT CONTAINSSTRING(Appointments[Appointment Subject], "Cancelled") && NOT Appointments[Assigned Staff Member] IN {{ICLA_STAFF_DAX}} && Appointments[Appointment Start Time] >= DATE(2025, 6, 1)'
    ICCH: 'NOT CONTAINSSTRING(Appointments[Appointment Subject], "available")'
    ICAU: 'TRUE()'

# Per-franchise data-version probes, run by both routes before and after each calibration run.
# A mismatch means the sandbox snapshot and the dataset refresh hold different data (drift), so
# disagreements in that window are not evidence of a logic error.
checksum_probes:
  - id: opportunities
    sql: "SELECT COUNT(*), SUM(`Amount`), SUM(`Revised Stage` = 'Sold'), SUM(CASE WHEN `Revised Stage` = 'Sold' THEN `Amount` END) FROM Salesforce_Data"
    dax: 'EVALUATE ROW("n", COUNTROWS(Salesforce_Data), "amt", SUM(Salesforce_Data[Amount]), "sold", [Count Sold], "sold_amt", [Revenue Sold])'
  - id: dates
    sql: "SELECT DATEDIFF(MAX(`Created Date`), '2000-01-01'), DATEDIFF(MAX(`Original Project Sold Date`), '2000-01-01'), DATEDIFF(MAX(`Last Modified Date`), '2000-01-01') FROM Salesforce_Data"
    dax: 'EVALUATE ROW("c", INT(MAX(Salesforce_Data[Created Date]) - DATE(2000, 1, 1)), "s", INT(MAX(Salesforce_Data[Original Project Sold Date]) - DATE(2000, 1, 1)), "m", INT(MAX(Salesforce_Data[Last Modified Date]) - DATE(2000, 1, 1)))'
  - id: leads
    sql: "SELECT COUNT(*), SUM(`Lead Status` = 'Moved to Studio'), DATEDIFF(MAX(`Lead Created Date`), '2000-01-01') FROM Leads"
    dax: 'EVALUATE ROW("n", COUNTROWS(Leads), "studio", [Converted Lead Count], "maxd", INT(MAX(Leads[Lead Created Date]) - DATE(2000, 1, 1)))'
  - id: appointments
    sql: "SELECT COUNT(*), SUM(`Project Stage` = 'Sold'), DATEDIFF(MAX(`Appointment Start Time`), '2000-01-01') FROM Appointments"
    dax: 'EVALUATE ROW("n", COUNTROWS(Appointments), "sold", [Sold Project Count], "maxd", INT(MAX(Appointments[Appointment Start Time]) - DATE(2000, 1, 1)))'
  - id: journey
    sql: "SELECT COUNT(*), SUM(`Exclude From Journey` = 0), SUM(`Journey Outcome` = 'Sold'), (SELECT COUNT(*) FROM Leads_Journey) FROM `Lead Milestones`"
    dax: 'EVALUATE ROW("n", COUNTROWS(''Lead Milestones''), "jn", [JN Leads], "sold", CALCULATE(COUNTROWS(''Lead Milestones''), ''Lead Milestones''[Journey Outcome] = "Sold"), "lj", COUNTROWS(Leads_Journey))'
  - id: designers
    sql: "SELECT COUNT(*), SUM(`Total Projects`) FROM dim_designers"
    dax: 'EVALUATE ROW("n", COUNTROWS(dim_designers), "tp", SUM(dim_designers[Total Projects]))'

templates:

  # =====================================================================================
  # DEV: the logged production questions for ICLA / ICCH / ICAU (70_production_questions.csv),
  # with rewritten references. Designer names in the logged text are replaced by params that
  # pick a designer with the same profile at run time (first names are unique in the franchise
  # so a first-name lookup is unambiguous). Dev is the example pool and B's tuning set.
  # =====================================================================================

  - id: DPQ04
    split: dev
    source: prod70:PQ04
    types: [sold_vs_created, time_intelligence]
    question: "what is the sold amount in {year}?"
    franchises: [ICAU]
    period: this_year
    date_basis: franchise_sales
    answer_shape: number
    result_columns: [Sold Amount, Sold Count]
    col_types: {Sold Amount: currency, Sold Count: count}
    headline: [Sold Amount]
    reference_sql: |
      SELECT SUM(`Amount`) AS `Sold Amount`, COUNT(*) AS `Sold Count`
      FROM Salesforce_Data
      WHERE `Revised Stage` = 'Sold'
        AND {sales_date_sql} >= '{d0}' AND {sales_date_sql} < '{d1_next}'
    reference_dax: |
      EVALUATE
      ROW(
        "Sold Amount", CALCULATE([Revenue Sold], DATESBETWEEN({sales_cal_dax}[Date], {d0_dax}, {d1_dax})),
        "Sold Count", CALCULATE([Count Sold], DATESBETWEEN({sales_cal_dax}[Date], {d0_dax}, {d1_dax}))
      )
    notes: "Austin sales count on the sold date. The logged reference used Created Date (wrong basis)."

  - id: DPQ10
    split: dev
    source: prod70:PQ10
    types: [sold_vs_created]
    question: "How much in sales has {designer|first} sold"
    franchises: [ICAU]
    params:
      designer:
        description: "active designer with the highest all-time sold amount whose first name matches no other designer"
        param_sql: |
          SELECT s.`Designer` FROM Salesforce_Data s
          WHERE s.`Revised Stage` = 'Sold' AND s.`Designer` IN (SELECT `Designer` FROM dim_designers)
          GROUP BY s.`Designer`
          HAVING (SELECT COUNT(DISTINCT s2.`Designer`) FROM Salesforce_Data s2
                  WHERE s2.`Designer` LIKE CONCAT('%', SUBSTRING_INDEX(s.`Designer`, ' ', 1), '%')) = 1
          ORDER BY SUM(s.`Amount`) DESC LIMIT 1
    period: ytd
    date_basis: franchise_sales
    answer_shape: number
    result_columns: [Sold Amount This Year, Sold Amount All Time]
    col_types: {Sold Amount This Year: currency, Sold Amount All Time: currency}
    headline: [Sold Amount This Year, Sold Amount All Time]
    reference_sql: |
      SELECT SUM(CASE WHEN {sales_date_sql} >= '{d0}' AND {sales_date_sql} < '{d1_next}' THEN `Amount` END) AS `Sold Amount This Year`,
             SUM(`Amount`) AS `Sold Amount All Time`
      FROM Salesforce_Data
      WHERE `Revised Stage` = 'Sold' AND `Designer` = {designer|sql}
    reference_dax: |
      EVALUATE
      ROW(
        "Sold Amount This Year", CALCULATE([Revenue Sold], Salesforce_Data[Designer] = {designer|dax}, DATESBETWEEN({sales_cal_dax}[Date], {d0_dax}, {d1_dax})),
        "Sold Amount All Time", CALCULATE([Revenue Sold], Salesforce_Data[Designer] = {designer|dax})
      )
    notes: "Answering rule 6: a person's sales with no period = this year on the franchise basis AND all time."

  - id: DPQ13
    split: dev
    source: prod70:PQ13
    types: [ranking, sold_vs_created]
    question: "show me top 3 designer at {year}"
    franchises: [ICAU]
    period: this_year
    date_basis: franchise_sales
    answer_shape: ranked_list
    result_columns: [Designer, Sold Amount, Sold Count]
    col_types: {Designer: text, Sold Amount: currency, Sold Count: count}
    label_column: Designer
    value_columns: [Sold Amount]
    top_k: 3
    order_by: {column: Sold Amount, direction: desc, ties: either order accepted}
    reference_sql: &top_designers_sql |
      SELECT `Designer`, SUM(`Amount`) AS `Sold Amount`, COUNT(*) AS `Sold Count`
      FROM Salesforce_Data
      WHERE `Revised Stage` = 'Sold'
        AND {sales_date_sql} >= '{d0}' AND {sales_date_sql} < '{d1_next}'
      GROUP BY `Designer`
      ORDER BY `Sold Amount` DESC, `Designer`
    reference_dax: &top_designers_dax |
      EVALUATE
      SELECTCOLUMNS(
        SUMMARIZECOLUMNS(
          Salesforce_Data[Designer],
          DATESBETWEEN({sales_cal_dax}[Date], {d0_dax}, {d1_dax}),
          "@amt", [Revenue Sold], "@n", [Count Sold]
        ),
        "Designer", Salesforce_Data[Designer], "Sold Amount", [@amt], "Sold Count", [@n]
      )
      ORDER BY [Sold Amount] DESC, [Designer]
    notes: "Ranked by sold amount on the franchise basis (Austin: sold date). The reference returns the full ranking; the scorer checks the top 3."

  - id: DPQ19
    split: dev
    source: prod70:PQ19
    types: [sold_vs_created, time_intelligence]
    question: "what sales has {designer|first} made this moth of {mname}"
    franchises: [ICAU]
    params:
      designer:
        description: "designer with the highest sold amount this month (franchise basis) whose first name is unique"
        param_sql: |
          SELECT s.`Designer` FROM Salesforce_Data s
          WHERE s.`Revised Stage` = 'Sold' AND {sales_date_sql} >= '{d0}' AND {sales_date_sql} < '{d1_next}'
          GROUP BY s.`Designer`
          HAVING (SELECT COUNT(DISTINCT s2.`Designer`) FROM Salesforce_Data s2
                  WHERE s2.`Designer` LIKE CONCAT('%', SUBSTRING_INDEX(s.`Designer`, ' ', 1), '%')) = 1
          ORDER BY SUM(s.`Amount`) DESC, s.`Designer` LIMIT 1
    period: this_month
    date_basis: franchise_sales
    answer_shape: number
    result_columns: [Sold Amount, Sold Count]
    col_types: {Sold Amount: currency, Sold Count: count}
    headline: [Sold Amount]
    reference_sql: |
      SELECT SUM(`Amount`) AS `Sold Amount`, COUNT(*) AS `Sold Count`
      FROM Salesforce_Data
      WHERE `Revised Stage` = 'Sold' AND `Designer` = {designer|sql}
        AND {sales_date_sql} >= '{d0}' AND {sales_date_sql} < '{d1_next}'
    reference_dax: |
      EVALUATE
      ROW(
        "Sold Amount", CALCULATE([Revenue Sold], Salesforce_Data[Designer] = {designer|dax}, DATESBETWEEN({sales_cal_dax}[Date], {d0_dax}, {d1_dax})),
        "Sold Count", CALCULATE([Count Sold], Salesforce_Data[Designer] = {designer|dax}, DATESBETWEEN({sales_cal_dax}[Date], {d0_dax}, {d1_dax}))
      )
    alternates:
      - label: the weekly report's designer leaderboard, month to date (rules section 9)
        reference_sql: |
          SELECT b.`sold_dollars_mtd` AS `Sold Amount`, b.`sold_count_mtd` AS `Sold Count`
          FROM report_designer_leaderboard b
          WHERE b.`report_date` = (SELECT MAX(`report_date`) FROM report_designer_leaderboard) AND b.`designer_name` = {designer|sql}
        reference_dax: |
          EVALUATE
          VAR _d = MAXX(ALL(report_designer_leaderboard[report_date]), report_designer_leaderboard[report_date])
          RETURN SELECTCOLUMNS(
                   FILTER(report_designer_leaderboard, report_designer_leaderboard[report_date] = _d && report_designer_leaderboard[designer_name] = {designer|dax}),
                   "Sold Amount", report_designer_leaderboard[sold_dollars_mtd], "Sold Count", report_designer_leaderboard[sold_count_mtd])
    notes: "Typos and the partial first name are kept from the log. Early in a month the param picks whoever has sold so far. Rules section 9 sends 'this month' sales to the weekly report; its month-to-date figure is the alternate and should equal the detail query."

  - id: DPQ22
    split: dev
    source: prod70:PQ22
    types: [ranking, sold_vs_created]
    question: "top 3 designers at {year} as a table"
    franchises: [ICAU]
    period: this_year
    date_basis: franchise_sales
    answer_shape: ranked_list
    result_columns: [Designer, Sold Amount, Sold Count]
    col_types: {Designer: text, Sold Amount: currency, Sold Count: count}
    label_column: Designer
    value_columns: [Sold Amount]
    top_k: 3
    order_by: {column: Sold Amount, direction: desc, ties: either order accepted}
    reference_sql: *top_designers_sql
    reference_dax: *top_designers_dax
    notes: "Same query as DPQ13; the 'as a table' override must not change the numbers."

  - id: DPQ23
    split: dev
    source: prod70:PQ23
    types: [ranking, sold_vs_created]
    question: "who are my top 3 designer at {year}?"
    franchises: [ICLA]
    period: this_year
    date_basis: franchise_sales
    answer_shape: ranked_list
    result_columns: [Designer, Sold Amount, Sold Count]
    col_types: {Designer: text, Sold Amount: currency, Sold Count: count}
    label_column: Designer
    value_columns: [Sold Amount]
    top_k: 3
    order_by: {column: Sold Amount, direction: desc, ties: either order accepted}
    reference_sql: *top_designers_sql
    reference_dax: *top_designers_dax
    notes: "Los Angeles ranks sales on the created date."

  - id: DPQ24
    split: dev
    source: prod70:PQ24
    types: [ranking, sold_vs_created]
    question: "top 3 designers in {year}, display as a bar chart"
    franchises: [ICLA]
    period: this_year
    date_basis: franchise_sales
    answer_shape: ranked_list
    result_columns: [Designer, Sold Amount, Sold Count]
    col_types: {Designer: text, Sold Amount: currency, Sold Count: count}
    label_column: Designer
    value_columns: [Sold Amount]
    top_k: 3
    order_by: {column: Sold Amount, direction: desc, ties: either order accepted}
    reference_sql: *top_designers_sql
    reference_dax: *top_designers_dax

  - id: DPQ25
    split: dev
    source: prod70:PQ25
    types: [row_level_list]
    question: "show me project notes for {designer|first}'s lost projects in {year}"
    franchises: [ICAU]
    params:
      designer: &lost_designer_param
        description: "designer with 5-25 lost projects created in the period (most first), unique first name"
        param_sql: |
          SELECT s.`Designer` FROM Salesforce_Data s
          WHERE s.`Revised Stage` = 'Lost' AND s.`Created Date` >= '{d0}' AND s.`Created Date` < '{d1_next}'
          GROUP BY s.`Designer`
          HAVING COUNT(*) BETWEEN 5 AND 25
             AND (SELECT COUNT(DISTINCT s2.`Designer`) FROM Salesforce_Data s2
                  WHERE s2.`Designer` LIKE CONCAT('%', SUBSTRING_INDEX(s.`Designer`, ' ', 1), '%')) = 1
          ORDER BY COUNT(*) DESC, s.`Designer` LIMIT 1
    period: this_year
    date_basis: created
    answer_shape: table
    result_columns: [Project Name, Amount, Created Date, Project Notes]
    col_types: {Project Name: text, Amount: currency, Created Date: date, Project Notes: text}
    label_column: Project Name
    value_columns: [Amount]
    reference_sql: &designer_lost_list_sql |
      SELECT `Project Name`, `Amount`, `Created Date`, `Project Notes`
      FROM Salesforce_Data
      WHERE `Revised Stage` = 'Lost' AND `Designer` = {designer|sql}
        AND `Created Date` >= '{d0}' AND `Created Date` < '{d1_next}'
      ORDER BY `Created Date` DESC, `Project Name`
    reference_dax: &designer_lost_list_dax |
      EVALUATE
      SELECTCOLUMNS(
        FILTER(
          Salesforce_Data,
          Salesforce_Data[Revised Stage] = "Lost" && Salesforce_Data[Designer] = {designer|dax}
            && Salesforce_Data[Created Date] >= {d0_dax} && Salesforce_Data[Created Date] < {d1_next_dax}
        ),
        "Project Name", Salesforce_Data[Project Name], "Amount", Salesforce_Data[Amount],
        "Created Date", Salesforce_Data[Created Date], "Project Notes", Salesforce_Data[Project Notes]
      )
      ORDER BY [Created Date] DESC, [Project Name]
    notes: "Lost projects have no sold date: the period is on Created Date (answering rule 9). Row list, every row, with notes."

  - id: DPQ33
    split: dev
    source: prod70:PQ33
    types: []
    question: "sold amount"
    franchises: [ICLA]
    period: all_time
    date_basis: none
    answer_shape: number
    result_columns: [Sold Amount, Sold Count]
    col_types: {Sold Amount: currency, Sold Count: count}
    headline: [Sold Amount]
    reference_sql: |
      SELECT SUM(`Amount`) AS `Sold Amount`, COUNT(*) AS `Sold Count`
      FROM Salesforce_Data WHERE `Revised Stage` = 'Sold'
    reference_dax: |
      EVALUATE ROW("Sold Amount", [Revenue Sold], "Sold Count", [Count Sold])
    alternates:
      - label: this year on the franchise basis (a sensible default the answer states)
        period: ytd
        reference_sql: |
          SELECT SUM(`Amount`) AS `Sold Amount`, COUNT(*) AS `Sold Count`
          FROM Salesforce_Data
          WHERE `Revised Stage` = 'Sold' AND {sales_date_sql} >= '{d0}' AND {sales_date_sql} < '{d1_next}'
        reference_dax: |
          EVALUATE
          ROW(
            "Sold Amount", CALCULATE([Revenue Sold], DATESBETWEEN({sales_cal_dax}[Date], {d0_dax}, {d1_dax})),
            "Sold Count", CALCULATE([Count Sold], DATESBETWEEN({sales_cal_dax}[Date], {d0_dax}, {d1_dax}))
          )
    notes: "Bare question. All time is the logged intent; a stated this-year default is acceptable."

  - id: DPQ35
    split: dev
    source: prod70:PQ35
    types: [row_level_list]
    question: "I need detailed report on {designer|first}'s lost projects in {year}"
    franchises: [ICAU]
    params:
      designer: *lost_designer_param
    period: this_year
    date_basis: created
    answer_shape: table
    result_columns: [Project Name, Amount, Created Date, Project Notes]
    col_types: {Project Name: text, Amount: currency, Created Date: date, Project Notes: text}
    label_column: Project Name
    value_columns: [Amount]
    reference_sql: *designer_lost_list_sql
    reference_dax: *designer_lost_list_dax
    notes: "A report means every row (answering rule 2), not a count."

  - id: DPQ36
    split: dev
    source: prod70:PQ36
    types: [row_level_list]
    question: "I want all 23 projects details report in excel"
    franchises: [ICAU]
    answer_shape: rubric
    rubric:
      - "does not refuse the Excel request or say it cannot export"
      - "with no earlier context, asks which 23 projects are meant or returns a sensible project table and says what it shows"
      - "does not invent 23 projects or numbers"
    notes: "Logged as a follow-up; asked cold it has no single reference. Refusal-guard check from production."

  - id: DPQ38
    split: dev
    source: prod70:PQ38
    types: [row_level_list, ranking]
    question: "show me top 5 lost projects by {designer|first} in {year}"
    franchises: [ICLA]
    params:
      designer:
        description: "designer with the most lost projects created in the period (at least 5), unique first name"
        param_sql: |
          SELECT s.`Designer` FROM Salesforce_Data s
          WHERE s.`Revised Stage` = 'Lost' AND s.`Created Date` >= '{d0}' AND s.`Created Date` < '{d1_next}'
          GROUP BY s.`Designer`
          HAVING COUNT(*) >= 5
             AND (SELECT COUNT(DISTINCT s2.`Designer`) FROM Salesforce_Data s2
                  WHERE s2.`Designer` LIKE CONCAT('%', SUBSTRING_INDEX(s.`Designer`, ' ', 1), '%')) = 1
          ORDER BY COUNT(*) DESC, s.`Designer` LIMIT 1
    period: this_year
    date_basis: created
    answer_shape: ranked_list
    result_columns: [Project Name, Amount, Created Date]
    col_types: {Project Name: text, Amount: currency, Created Date: date}
    label_column: Project Name
    value_columns: [Amount]
    top_k: 5
    order_by: {column: Amount, direction: desc, ties: either order accepted}
    reference_sql: |
      SELECT `Project Name`, `Amount`, `Created Date`
      FROM Salesforce_Data
      WHERE `Revised Stage` = 'Lost' AND `Designer` = {designer|sql}
        AND `Created Date` >= '{d0}' AND `Created Date` < '{d1_next}'
      ORDER BY `Amount` DESC, `Project Name`
    reference_dax: |
      EVALUATE
      SELECTCOLUMNS(
        FILTER(
          Salesforce_Data,
          Salesforce_Data[Revised Stage] = "Lost" && Salesforce_Data[Designer] = {designer|dax}
            && Salesforce_Data[Created Date] >= {d0_dax} && Salesforce_Data[Created Date] < {d1_next_dax}
        ),
        "Project Name", Salesforce_Data[Project Name], "Amount", Salesforce_Data[Amount], "Created Date", Salesforce_Data[Created Date]
      )
      ORDER BY [Amount] DESC, [Project Name]
    notes: "Top 5 by amount. The logged reference checked only a COUNT."

  - id: DPQ39
    split: dev
    source: prod70:PQ39
    types: []
    question: "How many sales has {designer|first} generated since the beginning"
    franchises: [ICAU]
    params:
      designer: &top_alltime_designer
        description: "active designer with the highest all-time sold amount whose first name is unique"
        param_sql: |
          SELECT s.`Designer` FROM Salesforce_Data s
          WHERE s.`Revised Stage` = 'Sold' AND s.`Designer` IN (SELECT `Designer` FROM dim_designers)
          GROUP BY s.`Designer`
          HAVING (SELECT COUNT(DISTINCT s2.`Designer`) FROM Salesforce_Data s2
                  WHERE s2.`Designer` LIKE CONCAT('%', SUBSTRING_INDEX(s.`Designer`, ' ', 1), '%')) = 1
          ORDER BY SUM(s.`Amount`) DESC LIMIT 1
    period: all_time
    date_basis: none
    answer_shape: number
    result_columns: [Sold Count, Sold Amount]
    col_types: {Sold Count: count, Sold Amount: currency}
    headline: [Sold Count]
    reference_sql: |
      SELECT COUNT(*) AS `Sold Count`, SUM(`Amount`) AS `Sold Amount`
