  - id: T145
    split: test
    source: e2e170:Q038
    types: [time_intelligence, sold_vs_created]
    question: "How do last quarter's sales compare with the same quarter last year?"
    franchises: [ICCH, ICAU]
    period: last_quarter
    periods: {prev: last_quarter_last_year}
    date_basis: franchise_sales
    answer_shape: number
    result_columns: [Sold Amount Last Quarter, Sold Amount Same Quarter Last Year, Change %]
    col_types: {Sold Amount Last Quarter: currency, Sold Amount Same Quarter Last Year: currency, Change %: percent}
    headline: [Sold Amount Last Quarter, Sold Amount Same Quarter Last Year]
    reference_sql: |
      SELECT t.a AS `Sold Amount Last Quarter`, t.b AS `Sold Amount Same Quarter Last Year`, 100 * (t.a - t.b) / t.b AS `Change %`
      FROM (SELECT SUM(CASE WHEN {sales_date_sql} >= '{d0}' AND {sales_date_sql} < '{d1_next}' THEN `Amount` END) AS a,
                   SUM(CASE WHEN {sales_date_sql} >= '{prev.d0}' AND {sales_date_sql} < '{prev.d1_next}' THEN `Amount` END) AS b
            FROM Salesforce_Data WHERE `Revised Stage` = 'Sold') t
    reference_dax: |
      EVALUATE
      VAR _a = CALCULATE([Revenue Sold], DATESBETWEEN({sales_cal_dax}[Date], {d0_dax}, {d1_dax}))
      VAR _b = CALCULATE([Revenue Sold], DATESBETWEEN({sales_cal_dax}[Date], {prev.d0_dax}, {prev.d1_dax}))
      RETURN ROW("Sold Amount Last Quarter", _a, "Sold Amount Same Quarter Last Year", _b, "Change %", 100 * DIVIDE(_a - _b, _b))

  - id: T120
    split: test
    source: prodlog
    types: [closing_rate, ranking]
    question: "Among my active designers, who closed the highest share of their $5,000 to $10,000 projects created this year (sold out of all such projects)? Only designers with at least 10 of them."
    franchises: [ICCH, ICAU]
    period: ytd
    date_basis: created
    answer_shape: ranked_list
    result_columns: [Designer, Closing %, Sold, Projects]
    col_types: {Designer: text, Closing %: percent, Sold: count, Projects: count}
    label_column: Designer
    value_columns: [Closing %]
    top_k: 5
    order_by: {column: Closing %, direction: desc, ties: either order accepted}
    reference_sql: |
      SELECT s.`Designer`, 100 * SUM(s.`Revised Stage` = 'Sold') / COUNT(*) AS `Closing %`,
             SUM(s.`Revised Stage` = 'Sold') AS `Sold`, COUNT(*) AS `Projects`
      FROM Salesforce_Data s JOIN dim_designers d ON d.`Designer` = s.`Designer`
      WHERE s.`Amount` >= 5000 AND s.`Amount` <= 10000
        AND s.`Created Date` >= '{d0}' AND s.`Created Date` < '{d1_next}'
      GROUP BY s.`Designer`
      HAVING COUNT(*) >= 10
      ORDER BY `Closing %` DESC, `Projects` DESC, s.`Designer`
    reference_dax: |
      EVALUATE
      VAR _t =
        ADDCOLUMNS(
          VALUES(dim_designers[Designer]),
          "@n", CALCULATE([Count Total Projects], DATESBETWEEN(DateTable[Date], {d0_dax}, {d1_dax}),
                          Salesforce_Data[Amount] >= 5000, Salesforce_Data[Amount] <= 10000),
          "@s", CALCULATE([Count Sold], DATESBETWEEN(DateTable[Date], {d0_dax}, {d1_dax}),
                          Salesforce_Data[Amount] >= 5000, Salesforce_Data[Amount] <= 10000)
        )
      RETURN
        SELECTCOLUMNS(FILTER(_t, [@n] >= 10 && NOT ISBLANK(dim_designers[Designer])),
                      "Designer", dim_designers[Designer], "Closing %", 100 * DIVIDE([@s], [@n]) + 0, "Sold", [@s] + 0, "Projects", [@n])
      ORDER BY [Closing %] DESC, [Projects] DESC, [Designer]
    notes: "Logged demand ('best success rate on $5k-$10k projects, currently active designers'), with the definition stated in the question: created-this-year cohort in the price band, Sold / all stages, active roster, volume guard 10."

  - id: T121
    split: test
    source: prodlog
    types: [cohort_funnel]
    question: "What was the lead conversion rate for leads created in {mname}, leaving out duplicates and junk?"
    franchises: [ICLA, ICCH]
    period: two_months_ago
    date_basis: lead_created
    answer_shape: number
    result_columns: [Conversion %, Moved to Studio, Leads]
    col_types: {Conversion %: percent, Moved to Studio: count, Leads: count}
    headline: [Conversion %]
    reference_sql: |
      SELECT 100 * SUM(`Lead Status` = 'Moved to Studio') / COUNT(*) AS `Conversion %`,
             SUM(`Lead Status` = 'Moved to Studio') AS `Moved to Studio`, COUNT(*) AS `Leads`
      FROM Leads
      WHERE COALESCE(`Lead Status`, '') NOT IN ('Junk', 'Duplicate')
        AND `Lead Created Date` >= '{d0}' AND `Lead Created Date` < '{d1_next}'
    reference_dax: |
      EVALUATE
      CALCULATETABLE(
        ROW("Conversion %", 100 * [Lead Conversion Rate], "Moved to Studio", [Converted Lead Count], "Leads", [Total Lead Count]),
        DATESBETWEEN(DateTable[Date], {d0_dax}, {d1_dax}),
        KEEPFILTERS(NOT Leads[Lead Status] IN {"Junk", "Duplicate"})
      )
    notes: "Logged demand (conversion % for a month's leads without duplicates or junk). Lead conversion = current status Moved to Studio / leads, by lead created month, Junk and Duplicate statuses left out of both counts."

