    reference_sql: |
      SELECT 100 * SUM(`Project Stage` = 'Sold') / COUNT(*) AS `Success Rate`,
             SUM(`Project Stage` = 'Sold') AS `Sold-Project Appointments`, COUNT(*) AS `Appointments`
      FROM Appointments
      WHERE {appt_rule_sql} AND `Appointment Start Time` >= '{d0}' AND `Appointment Start Time` < '{d1_next}'
    reference_dax: |
