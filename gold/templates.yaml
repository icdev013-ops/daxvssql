             SUM(`Activity Type` = 'Design') AS `Design Appointments`, COUNT(*) AS `Appointments`
      FROM Appointments
      WHERE {appt_rule_sql} AND `Appointment Start Time` >= '{d0}' AND `Appointment Start Time` < '{d1_next}'
    reference_dax: |
