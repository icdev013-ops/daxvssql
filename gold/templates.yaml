  - id: T012
    split: test
    source: fresh
    types: [time_intelligence, sold_vs_created]
    question: "How did {year} sales compare with {prev.year}?"
    franchises: [ICLA, ICCH]
    period: last_year
    periods: {prev: two_years_ago}
    date_basis: franchise_sales
    answer_shape: number
    result_columns: [Sold Amount Last Year, Sold Amount Year Before, Change %]
    col_types: {Sold Amount Last Year: currency, Sold Amount Year Before: currency, Change %: percent}
    headline: [Sold Amount Last Year, Sold Amount Year Before]
    reference_sql: |
      SELECT t.ly AS `Sold Amount Last Year`, t.py AS `Sold Amount Year Before`, 100 * (t.ly - t.py) / t.py AS `Change %`
      FROM (
        SELECT SUM(CASE WHEN {sales_date_sql} >= '{d0}' AND {sales_date_sql} < '{d1_next}' THEN `Amount` END) AS ly,
               SUM(CASE WHEN {sales_date_sql} >= '{prev.d0}' AND {sales_date_sql} < '{prev.d1_next}' THEN `Amount` END) AS py
        FROM Salesforce_Data WHERE `Revised Stage` = 'Sold'
      ) t
    reference_dax: |
      EVALUATE
      VAR _ly = CALCULATE([Revenue Sold], DATESBETWEEN({sales_cal_dax}[Date], {d0_dax}, {d1_dax}))
      VAR _py = CALCULATE([Revenue Sold], DATESBETWEEN({sales_cal_dax}[Date], {prev.d0_dax}, {prev.d1_dax}))
      RETURN ROW("Sold Amount Last Year", _ly, "Sold Amount Year Before", _py, "Change %", 100 * DIVIDE(_ly - _py, _py))
    notes: "Two full calendar years, franchise basis. On the sold-date basis older years miss Sold rows with no sold date."

  - &T013
