        result_columns: [Leads This Month, Leads Same Days Last Month]
        col_types: {Leads This Month: count, Leads Same Days Last Month: count}
        reference_sql: |
          SELECT SUM(`Lead Created Date` >= '{a.d0}' AND `Lead Created Date` < '{a.d1_next}') AS `Leads This Month`,
                 SUM(`Lead Created Date` >= '{b.d0}' AND `Lead Created Date` < '{b.d1_next}') AS `Leads Same Days Last Month`
          FROM Leads
        reference_dax: |
          EVALUATE
          ROW(
            "Leads This Month", CALCULATE([Total Lead Count], DATESBETWEEN(DateTable[Date], {a.d0_dax}, {a.d1_dax})),
            "Leads Same Days Last Month", CALCULATE([Total Lead Count], DATESBETWEEN(DateTable[Date], {b.d0_dax}, {b.d1_dax}))
          )

