  - &T079
    id: T079
    split: test
    source: fresh
    types: [appointments_sales, appointments_rules, sold_vs_created]
    question: "On average, how many appointments did it take to close the projects we sold last quarter?"
    franchises: [ICLA, ICCH, ICAU]
    period: last_quarter
    date_basis: franchise_sales
    answer_shape: number
    result_columns: [Average Appointments, Sold Projects, Appointments]
    col_types: {Average Appointments: number, Sold Projects: count, Appointments: count}
    headline: [Average Appointments]
    reference_sql: |
      WITH sold AS (
        SELECT `Project Name` FROM Salesforce_Data
        WHERE `Revised Stage` = 'Sold' AND {sales_date_sql} >= '{d0}' AND {sales_date_sql} < '{d1_next}'
      ), appts AS (
        SELECT COUNT(*) AS n FROM Appointments
        WHERE {appt_rule_sql} AND `Project Name` IN (SELECT `Project Name` FROM sold)
      )
      SELECT appts.n / (SELECT COUNT(*) FROM sold) AS `Average Appointments`,
             (SELECT COUNT(*) FROM sold) AS `Sold Projects`, appts.n AS `Appointments`
      FROM appts
    reference_dax: |
      EVALUATE
      VAR _names = FILTER(CALCULATETABLE(VALUES(Salesforce_Data[Project Name]), Salesforce_Data[Revised Stage] = "Sold",
                                         DATESBETWEEN({sales_cal_dax}[Date], {d0_dax}, {d1_dax})),
                          Salesforce_Data[Project Name] <> "")
      VAR _n = CALCULATE([Count Sold], DATESBETWEEN({sales_cal_dax}[Date], {d0_dax}, {d1_dax}))
      VAR _a = CALCULATE([Total Activity Count], {appt_rule_dax}, TREATAS(_names, Appointments[Project Name])) + 0
      RETURN ROW("Average Appointments", DIVIDE(_a, _n), "Sold Projects", _n, "Appointments", _a)
    notes: "Appointments under the franchise rule (any date) on the sold projects' names, each appointment counted once, divided by the number of sold projects (rules section 8: count each appointment once and each project once)."

