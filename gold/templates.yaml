  # ---------------------------------------------------------------- cohort / funnel
  # Lead-journey questions use the 'Lead Milestones' table and the JN measures (answering rule 13):
  # duplicates and junk are left out ([Exclude From Journey] = 0), the period is on the lead's
  # created date, medians are medians.

  - &T090
    id: T090
    split: test
    source: prodlog
    types: [cohort_funnel]
    question: "Of the leads we got this year, how many booked an appointment, how many reached the studio, and how many bought?"
    franchises: [ICLA, ICCH, ICAU]
    period: ytd
    date_basis: lead_created
    answer_shape: number
    result_columns: [Leads, Booked, Reached Studio, Sold]
    col_types: {Leads: count, Booked: count, Reached Studio: count, Sold: count}
    headline: [Leads, Booked, Reached Studio, Sold]
    reference_sql: |
      SELECT COUNT(*) AS `Leads`, SUM(m.`Booked Appointment` = 1) AS `Booked`,
             SUM(m.`Reached Studio` = 1) AS `Reached Studio`, SUM(m.`Journey Outcome` = 'Sold') AS `Sold`
      FROM `Lead Milestones` m JOIN Leads l ON l.`Lead ID` = m.`Lead ID`
      WHERE m.`Exclude From Journey` = 0
        AND l.`Lead Created Date` >= '{d0}' AND l.`Lead Created Date` < '{d1_next}'
    reference_dax: |
      EVALUATE
      CALCULATETABLE(
        ROW("Leads", [JN Leads], "Booked", [JN Booked], "Reached Studio", [JN Studio], "Sold", [JN Sold]),
        DATESBETWEEN(DateTable[Date], {d0_dax}, {d1_dax})
      )
    notes: "Lead journey funnel (JN measures): leads created this year, duplicates and junk left out."

  - id: T091
    split: test
    source: recipe:LJ journey by channel
    types: [cohort_funnel]
    question: "For this year's leads, show me leads, sales and win rate by channel."
    franchises: [ICCH, ICAU]
    period: ytd
    date_basis: lead_created
    answer_shape: table
    result_columns: [Lead Source Channel, Leads, Sold, Win %]
    col_types: {Lead Source Channel: text, Leads: count, Sold: count, Win %: percent}
    label_column: Lead Source Channel
    value_columns: [Leads, Sold, Win %]
    reference_sql: |
      SELECT l.`Lead Source Channel`, COUNT(*) AS `Leads`, SUM(m.`Journey Outcome` = 'Sold') AS `Sold`,
             100 * SUM(m.`Journey Outcome` = 'Sold') / COUNT(*) AS `Win %`
      FROM `Lead Milestones` m JOIN Leads l ON l.`Lead ID` = m.`Lead ID`
      WHERE m.`Exclude From Journey` = 0 AND l.`Lead Created Date` >= '{d0}' AND l.`Lead Created Date` < '{d1_next}'
        AND l.`Lead Source Channel` IS NOT NULL AND l.`Lead Source Channel` <> ''
      GROUP BY l.`Lead Source Channel`
      ORDER BY `Leads` DESC, l.`Lead Source Channel`
    reference_dax: |
      EVALUATE
      SELECTCOLUMNS(
        FILTER(
          SUMMARIZECOLUMNS(Leads[Lead Source Channel], DATESBETWEEN(DateTable[Date], {d0_dax}, {d1_dax}),
                           "@l", [JN Leads], "@s", [JN Sold]),
          NOT ISBLANK([@l]) && Leads[Lead Source Channel] <> ""
        ),
        "Lead Source Channel", Leads[Lead Source Channel], "Leads", [@l], "Sold", [@s], "Win %", 100 * DIVIDE([@s], [@l])
      )
      ORDER BY [Leads] DESC, [Lead Source Channel]
    notes: "Channel = Leads[Lead Source Channel]. Win % = [JN Win %] (sold / journey leads)."

  - &T092
    id: T092
    split: test
    source: fresh
    types: [cohort_funnel]
    question: "How long does it typically take a lead from this year to reach the studio?"
    franchises: [ICLA, ICCH, ICAU]
    period: ytd
    date_basis: lead_created
    answer_shape: number
    result_columns: [Median Days to Studio, Leads Measured]
    col_types: {Median Days to Studio: number, Leads Measured: count}
    headline: [Median Days to Studio]
    reference_sql: |
      WITH x AS (
        SELECT m.`Days to Studio` AS v
        FROM `Lead Milestones` m JOIN Leads l ON l.`Lead ID` = m.`Lead ID`
        WHERE m.`Exclude From Journey` = 0 AND m.`Days to Studio` IS NOT NULL AND m.`Days to Studio` >= 0
          AND l.`Lead Created Date` >= '{d0}' AND l.`Lead Created Date` < '{d1_next}'
      ), r AS (
        SELECT v, ROW_NUMBER() OVER (ORDER BY v) AS rn, COUNT(*) OVER () AS n FROM x
      )
      SELECT AVG(v) AS `Median Days to Studio`, MAX(n) AS `Leads Measured`
      FROM r WHERE rn IN (FLOOR((n + 1) / 2), FLOOR((n + 2) / 2))
    reference_dax: |
      EVALUATE
      CALCULATETABLE(
        ROW(
          "Median Days to Studio", [JN Days to Studio],
          "Leads Measured", COUNTROWS(FILTER('Lead Milestones', 'Lead Milestones'[Exclude From Journey] = 0
                                             && NOT ISBLANK('Lead Milestones'[Days to Studio]) && 'Lead Milestones'[Days to Studio] >= 0))
        ),
        DATESBETWEEN(DateTable[Date], {d0_dax}, {d1_dax})
      )
    notes: "'Typically' = the median ([JN Days to Studio] is MEDIANX), not the mean."

  - &T093
    id: T093
