  - id: A11
    split: ambiguity
    source: rules section 6
    types: [ranking]
    question: "Who's our top designer?"
    franchises: [ICCH]
    answer_shape: rubric
    rubric:
      - "answers with one of the listed readings and names the metric and period, or asks"
      - "the designer and number match the reading it names"
    readings:
      - label: highest sold revenue, all time (rules default for 'top performing' with no metric)
        period: all_time
        answer_shape: ranked_list
        result_columns: [Designer, Sold Amount]
        col_types: {Designer: text, Sold Amount: currency}
        label_column: Designer
        value_columns: [Sold Amount]
        top_k: 1
        order_by: {column: Sold Amount, direction: desc, ties: either order accepted}
        reference_sql: |
          SELECT `Designer`, SUM(`Amount`) AS `Sold Amount` FROM Salesforce_Data WHERE `Revised Stage` = 'Sold'
          GROUP BY `Designer` ORDER BY `Sold Amount` DESC, `Designer` LIMIT 10
        reference_dax: |
          EVALUATE
          TOPN(10, SELECTCOLUMNS(SUMMARIZECOLUMNS(Salesforce_Data[Designer], "@amt", [Revenue Sold]), "Designer", Salesforce_Data[Designer], "Sold Amount", [@amt]),
               [Sold Amount], DESC, [Designer], ASC)
          ORDER BY [Sold Amount] DESC, [Designer]
      - label: highest sold revenue this year (franchise basis)
        period: ytd
        answer_shape: ranked_list
        result_columns: [Designer, Sold Amount]
        col_types: {Designer: text, Sold Amount: currency}
        label_column: Designer
        value_columns: [Sold Amount]
        top_k: 1
        order_by: {column: Sold Amount, direction: desc, ties: either order accepted}
        reference_sql: |
          SELECT `Designer`, SUM(`Amount`) AS `Sold Amount` FROM Salesforce_Data
          WHERE `Revised Stage` = 'Sold' AND {sales_date_sql} >= '{d0}' AND {sales_date_sql} < '{d1_next}'
          GROUP BY `Designer` ORDER BY `Sold Amount` DESC, `Designer` LIMIT 10
        reference_dax: |
          EVALUATE
          TOPN(10, SELECTCOLUMNS(SUMMARIZECOLUMNS(Salesforce_Data[Designer], DATESBETWEEN({sales_cal_dax}[Date], {d0_dax}, {d1_dax}), "@amt", [Revenue Sold]),
                                 "Designer", Salesforce_Data[Designer], "Sold Amount", [@amt]),
               [Sold Amount], DESC, [Designer], ASC)
          ORDER BY [Sold Amount] DESC, [Designer]
