    question: "How many of this year's leads are still waiting on a response?"
    franchises: [ICCH, ICAU]
    period: ytd
    date_basis: lead_created
    answer_shape: number
    result_columns: [No Response Leads]
    col_types: {No Response Leads: count}
    headline: [No Response Leads]
    reference_sql: |
      SELECT COUNT(*) AS `No Response Leads` FROM Leads
      WHERE `Lead Status` LIKE '%No Response%' AND `Lead Created Date` >= '{d0}' AND `Lead Created Date` < '{d1_next}'
    reference_dax: |
      EVALUATE ROW("No Response Leads", CALCULATE([No Response Lead Count], DATESBETWEEN(DateTable[Date], {d0_dax}, {d1_dax})) + 0)
    notes: "[No Response Lead Count]: Lead Status contains 'No Response' (the 1st-5th Attempt statuses)."

  - id: T141
    split: test
    source: fresh
    types: [ranking, time_intelligence]
    question: "Which day of the week do most of our leads come in this year?"
    franchises: [ICLA, ICAU]
    period: ytd
    date_basis: lead_created
    answer_shape: ranked_list
    result_columns: [Weekday, Leads]
    col_types: {Weekday: text, Leads: count}
    label_column: Weekday
    value_columns: [Leads]
    top_k: 1
    order_by: {column: Leads, direction: desc, ties: either order accepted}
    reference_sql: |
      SELECT DAYNAME(`Lead Created Date`) AS `Weekday`, COUNT(*) AS `Leads`
      FROM Leads WHERE `Lead Created Date` >= '{d0}' AND `Lead Created Date` < '{d1_next}'
      GROUP BY DAYNAME(`Lead Created Date`)
      ORDER BY `Leads` DESC, `Weekday`
    reference_dax: |
      EVALUATE
      SELECTCOLUMNS(
        SUMMARIZECOLUMNS(DateTable[Weekday], DATESBETWEEN(DateTable[Date], {d0_dax}, {d1_dax}), "@n", [Total Lead Count]),
        "Weekday", DateTable[Weekday], "Leads", [@n]
      )
      ORDER BY [Leads] DESC, [Weekday]

  - id: T142
    split: test
    source: e2e170:Q031
    types: [time_intelligence]
    question: "How does the value of projects created this year compare with the same point last year?"
    franchises: [ICLA, ICCH]
    period: ytd
    periods: {prev: last_year_ytd}
    date_basis: created
    answer_shape: number
    result_columns: [Total Value This Year, Total Value Same Period Last Year, Change %]
    col_types: {Total Value This Year: currency, Total Value Same Period Last Year: currency, Change %: percent}
    headline: [Total Value This Year, Total Value Same Period Last Year]
    reference_sql: |
      SELECT t.ty AS `Total Value This Year`, t.ly AS `Total Value Same Period Last Year`, 100 * (t.ty - t.ly) / t.ly AS `Change %`
      FROM (SELECT SUM(CASE WHEN `Created Date` >= '{d0}' AND `Created Date` < '{d1_next}' THEN `Amount` END) AS ty,
                   SUM(CASE WHEN `Created Date` >= '{prev.d0}' AND `Created Date` < '{prev.d1_next}' THEN `Amount` END) AS ly
            FROM Salesforce_Data) t
    reference_dax: |
      EVALUATE
      VAR _ty = CALCULATE([Total Revenue], DATESBETWEEN(DateTable[Date], {d0_dax}, {d1_dax}))
      VAR _ly = CALCULATE([Total Revenue], DATESBETWEEN(DateTable[Date], {prev.d0_dax}, {prev.d1_dax}))
      RETURN ROW("Total Value This Year", _ty, "Total Value Same Period Last Year", _ly, "Change %", 100 * DIVIDE(_ty - _ly, _ly))
    notes: "All stages on created date; same-day windows. Not [Revenue Previous Year], which follows the filter context."

  - id: T143
