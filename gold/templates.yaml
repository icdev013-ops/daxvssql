      ROW(
        "Sold Percentage", 100 * CALCULATE([Sold Percentage], DATESBETWEEN(DateTable[Date], {d0_dax}, {d1_dax})),
        "Sold Amount", CALCULATE([Revenue Sold], DATESBETWEEN(DateTable[Date], {d0_dax}, {d1_dax})),
        "Total Value", CALCULATE([Total Revenue], DATESBETWEEN(DateTable[Date], {d0_dax}, {d1_dax}))
      )
    notes: "Revenue share ([Sold Percentage]) of the created-this-year cohort, not a count-based closing rate."

