        "Sold Count by Sold Date", CALCULATE([Count Sold], DATESBETWEEN(SoldDateTable[Date], {d0_dax}, {d1_dax})),
        "Sold Amount by Created Date", CALCULATE([Revenue Sold], DATESBETWEEN(DateTable[Date], {d0_dax}, {d1_dax})),
        "Sold Count by Created Date", CALCULATE([Count Sold], DATESBETWEEN(DateTable[Date], {d0_dax}, {d1_dax}))
      )

