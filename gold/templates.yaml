  - id: MT09-3
    split: multiturn
    conversation: MT09
    turn: 3
    source: prodlog
    types: [time_intelligence, sold_vs_created]
    question: "how does that month compare with the same month last year?"
    resolved_question: "Sold amount in the best month of this year vs the same calendar month last year (franchise basis)."
    franchises: [ICAU]
    params:
      best_y:
        description: "year of the best sales month this year (always the anchor year)"
        param_sql: |
          SELECT YEAR({sales_date_sql}) FROM Salesforce_Data
          WHERE `Revised Stage` = 'Sold' AND {sales_date_sql} >= '{anchor_year}-01-01' AND {sales_date_sql} < '{anchor_next}'
          GROUP BY YEAR({sales_date_sql}), MONTH({sales_date_sql}) ORDER BY SUM(`Amount`) DESC LIMIT 1
      best_m:
        description: "month number of the best sales month this year"
        param_sql: |
          SELECT MONTH({sales_date_sql}) FROM Salesforce_Data
          WHERE `Revised Stage` = 'Sold' AND {sales_date_sql} >= '{anchor_year}-01-01' AND {sales_date_sql} < '{anchor_next}'
          GROUP BY YEAR({sales_date_sql}), MONTH({sales_date_sql}) ORDER BY SUM(`Amount`) DESC LIMIT 1
    period: all_time
    date_basis: franchise_sales
    answer_shape: number
    result_columns: [Sold Amount That Month, Sold Amount Same Month Last Year]
    col_types: {Sold Amount That Month: currency, Sold Amount Same Month Last Year: currency}
    headline: [Sold Amount That Month, Sold Amount Same Month Last Year]
    reference_sql: |
      SELECT SUM(CASE WHEN YEAR({sales_date_sql}) = {best_y} AND MONTH({sales_date_sql}) = {best_m} THEN `Amount` END) AS `Sold Amount That Month`,
             SUM(CASE WHEN YEAR({sales_date_sql}) = {best_y} - 1 AND MONTH({sales_date_sql}) = {best_m} THEN `Amount` END) AS `Sold Amount Same Month Last Year`
      FROM Salesforce_Data WHERE `Revised Stage` = 'Sold'
    reference_dax: |
      EVALUATE
      ROW(
        "Sold Amount That Month", CALCULATE([Revenue Sold], DATESBETWEEN({sales_cal_dax}[Date], DATE({best_y}, {best_m}, 1), EOMONTH(DATE({best_y}, {best_m}, 1), 0))),
        "Sold Amount Same Month Last Year", CALCULATE([Revenue Sold], DATESBETWEEN({sales_cal_dax}[Date], DATE({best_y} - 1, {best_m}, 1), EOMONTH(DATE({best_y} - 1, {best_m}, 1), 0)))
      )

