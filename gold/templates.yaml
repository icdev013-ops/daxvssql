          GROUP BY `Designer` ORDER BY SUM(`Amount`) DESC, `Designer` LIMIT 1
    answer_shape: rubric
    rubric:
      - "does not present a forecast as fact; a run-rate projection is labelled an extrapolation with its method (e.g. year-to-date pace)"
      - "gives the year-to-date figure on the franchise basis and names the basis"
      - "any number given matches the facts"
    facts:
