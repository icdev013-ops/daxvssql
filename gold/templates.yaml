            AND `Lead Source` IS NOT NULL AND `Lead Source` <> ''
          GROUP BY `Lead Source` HAVING COUNT(*) BETWEEN 5 AND 40
          ORDER BY COUNT(*) DESC, `Lead Source` LIMIT 1
    period: ytd
