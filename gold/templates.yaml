      VAR _s = CALCULATE([Sold Project Count], {appt_rule_dax},
                         KEEPFILTERS(Appointments[Appointment Start Time] >= {d0_dax}),
                         KEEPFILTERS(Appointments[Appointment Start Time] < {d1_next_dax}))
      VAR _a = CALCULATE([Total Activity Count], {appt_rule_dax},
                         KEEPFILTERS(Appointments[Appointment Start Time] >= {d0_dax}),
                         KEEPFILTERS(Appointments[Appointment Start Time] < {d1_next_dax}))
      RETURN ROW("Success Rate", 100 * DIVIDE(_s, _a), "Sold-Project Appointments", _s, "Appointments", _a)
    notes: "[Project Success Rate] under the franchise appointment rule: appointments whose project stage is Sold / all appointments."

  - &T072
    id: T072
    split: test
    source: fresh
    types: [appointments_sales, appointments_rules, cohort_funnel]
    question: "Of the projects we had appointments with last month, how many have sold, and for how much?"
    franchises: [ICLA, ICCH, ICAU]
    period: last_month
    date_basis: appointment_start
    answer_shape: number
    result_columns: [Sold Projects, Sold Amount, Projects With Appointments]
    col_types: {Sold Projects: count, Sold Amount: currency, Projects With Appointments: count}
    headline: [Sold Projects, Sold Amount]
    reference_sql: |
      SELECT COUNT(*) AS `Sold Projects`, SUM(s.`Amount`) AS `Sold Amount`,
             (SELECT COUNT(DISTINCT `Project Name`) FROM Appointments
              WHERE {appt_rule_sql} AND `Appointment Start Time` >= '{d0}' AND `Appointment Start Time` < '{d1_next}'
                AND `Project Name` IS NOT NULL AND `Project Name` <> '') AS `Projects With Appointments`
      FROM Salesforce_Data s
      WHERE s.`Revised Stage` = 'Sold'
        AND s.`Project Name` IN (SELECT `Project Name` FROM Appointments
                                 WHERE {appt_rule_sql} AND `Appointment Start Time` >= '{d0}' AND `Appointment Start Time` < '{d1_next}'
                                   AND `Project Name` IS NOT NULL AND `Project Name` <> '')
    reference_dax: |
      EVALUATE
      VAR _p = FILTER(
                 CALCULATETABLE(VALUES(Appointments[Project Name]), {appt_rule_dax},
                                KEEPFILTERS(Appointments[Appointment Start Time] >= {d0_dax}),
                                KEEPFILTERS(Appointments[Appointment Start Time] < {d1_next_dax})),
                 Appointments[Project Name] <> "")
      RETURN
        ROW(
          "Sold Projects", CALCULATE([Count Sold], TREATAS(_p, Salesforce_Data[Project Name])),
          "Sold Amount", CALCULATE([Revenue Sold], TREATAS(_p, Salesforce_Data[Project Name])),
          "Projects With Appointments", COUNTROWS(_p)
        )
    notes: "Projects = distinct Project Names on last month's appointments (franchise rule). Sold = their opportunity rows now in Revised Stage Sold, whenever sold."

  - id: T073
