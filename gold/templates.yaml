  # =====================================================================================
  # MULTI-TURN: 12 three-turn conversations. Each turn is its own entry (id MTnn-k) with the
  # text as typed (question), the question it resolves to (resolved_question) and its own
  # references. Turns 2 and 3 are asked with the earlier turns in the history window.
  # =====================================================================================

  - id: MT01-1
    split: multiturn
    conversation: MT01
    turn: 1
    source: fresh
    types: [sold_vs_created]
    question: "How much did we sell this year?"
    resolved_question: "Sold amount this year on the franchise basis (sold date)."
    franchises: [ICCH]
    period: ytd
    date_basis: franchise_sales
    answer_shape: number
    result_columns: [Sold Amount, Sold Count]
    col_types: {Sold Amount: currency, Sold Count: count}
    headline: [Sold Amount]
    reference_sql: *sold_scalar_sql
    reference_dax: *sold_scalar_dax

  - id: MT01-2
    split: multiturn
    conversation: MT01
    turn: 2
    source: fresh
    types: [sold_vs_created]
    question: "and by created date?"
    resolved_question: "Sold amount this year by created date (projects created this year that are now Sold)."
    franchises: [ICCH]
    period: ytd
    date_basis: created (explicit)
    answer_shape: number
    result_columns: [Sold Amount, Sold Count]
    col_types: {Sold Amount: currency, Sold Count: count}
    headline: [Sold Amount]
    reference_sql: |
      SELECT SUM(`Amount`) AS `Sold Amount`, COUNT(*) AS `Sold Count`
      FROM Salesforce_Data
      WHERE `Revised Stage` = 'Sold' AND `Created Date` >= '{d0}' AND `Created Date` < '{d1_next}'
    reference_dax: |
      EVALUATE
      ROW(
        "Sold Amount", CALCULATE([Revenue Sold], DATESBETWEEN(DateTable[Date], {d0_dax}, {d1_dax})),
        "Sold Count", CALCULATE([Count Sold], DATESBETWEEN(DateTable[Date], {d0_dax}, {d1_dax}))
      )

  - id: MT01-3
    split: multiturn
    conversation: MT01
