  - id: T106
    split: test
    source: fresh
    types: [cohort_funnel]
    question: "Of the projects created last year, what share sold, were lost, went dead, or are still open?"
    franchises: [ICLA, ICCH]
    period: last_year
    date_basis: created
    answer_shape: table
    result_columns: [Stage, Share %, Projects]
    col_types: {Stage: text, Share %: percent, Projects: count}
    label_column: Stage
    value_columns: [Share %, Projects]
    reference_sql: |
      SELECT `Revised Stage` AS `Stage`, 100 * COUNT(*) / (SELECT COUNT(*) FROM Salesforce_Data
                                                          WHERE `Created Date` >= '{d0}' AND `Created Date` < '{d1_next}') AS `Share %`,
             COUNT(*) AS `Projects`
      FROM Salesforce_Data WHERE `Created Date` >= '{d0}' AND `Created Date` < '{d1_next}'
      GROUP BY `Revised Stage`
      ORDER BY `Projects` DESC, `Stage`
    reference_dax: |
      EVALUATE
      VAR _all = CALCULATE([Count Total Projects], DATESBETWEEN(DateTable[Date], {d0_dax}, {d1_dax}))
      RETURN
        SELECTCOLUMNS(
          SUMMARIZECOLUMNS(Salesforce_Data[Revised Stage], DATESBETWEEN(DateTable[Date], {d0_dax}, {d1_dax}), "@n", [Count Total Projects]),
          "Stage", Salesforce_Data[Revised Stage], "Share %", 100 * DIVIDE([@n], _all), "Projects", [@n]
        )
      ORDER BY [Projects] DESC, [Stage]

  # ---------------------------------------------------------------- closing rate
  # Each question names its definition, so none of these is ambiguous:
  #   Salesforce-style ([Closing Rate]) = projects SOLD in the window (sold date) / projects
  #     CREATED in the window (created date, Dead Lead included), capped at 100%
  #   cohort ([Closing Rate (Cohort)])  = sold in the window / created in the window excluding
  #     Dead Lead, no cap
  #   by count (weekly report)          = Sold / (Sold + Lost + Dead Lead), created-date cohort
  # Bare "closing rate" questions live in the ambiguity split.

  - &T110
    id: T110
    split: test
    source: recipe:CLS-001
    types: [closing_rate]
    question: "What's our closing % for the last 4 months, Salesforce-style (projects sold in the window divided by projects created in it)?"
    franchises: [ICLA, ICCH, ICAU]
    period: last_4_months
    date_basis: sold (numerator) / created (denominator)
    answer_shape: number
    result_columns: [Closing %, Sold, Created]
    col_types: {Closing %: percent, Sold: count, Created: count}
    headline: [Closing %]
    reference_sql: |
      SELECT LEAST(100, 100 * s.n / c.n) AS `Closing %`, s.n AS `Sold`, c.n AS `Created`
      FROM (SELECT COUNT(*) AS n FROM Salesforce_Data
            WHERE `Revised Stage` = 'Sold' AND `Original Project Sold Date` >= '{d0}' AND `Original Project Sold Date` < '{d1_next}') s
      CROSS JOIN (SELECT COUNT(*) AS n FROM Salesforce_Data
                  WHERE `Created Date` >= '{d0}' AND `Created Date` < '{d1_next}') c
    reference_dax: |
      EVALUATE
      CALCULATETABLE(
        ROW("Closing %", 100 * [Closing Rate], "Sold", [Projects Sold (Period)], "Created", [Projects Created (Period)]),
        DATESBETWEEN(DateTable[Date], {d0_dax}, {d1_dax})
      )
    notes: "The window is the 4 months ending on the anchor date (EDATE(anchor, -4) to anchor), as the Salesforce 'Closing % - Last 4 Months' report and recipe CLS-001."

  - &T111
    id: T111
    split: test
    source: recipe:DSG-017
    types: [closing_rate, ranking]
    question: "Rank my active designers by Salesforce-style closing % for the last 4 months. Only designers with at least 10 projects created in that time."
    franchises: [ICLA, ICCH, ICAU]
    period: last_4_months
    date_basis: sold (numerator) / created (denominator)
    answer_shape: ranked_list
    result_columns: [Designer, Closing %, Sold, Created]
    col_types: {Designer: text, Closing %: percent, Sold: count, Created: count}
    label_column: Designer
    value_columns: [Closing %]
    top_k: 5
    order_by: {column: Closing %, direction: desc, ties: either order accepted}
    reference_sql: |
      SELECT c.`Designer`, LEAST(100, 100 * COALESCE(s.n, 0) / c.n) AS `Closing %`, COALESCE(s.n, 0) AS `Sold`, c.n AS `Created`
      FROM (SELECT sd.`Designer`, COUNT(*) AS n FROM Salesforce_Data sd JOIN dim_designers d ON d.`Designer` = sd.`Designer`
            WHERE sd.`Created Date` >= '{d0}' AND sd.`Created Date` < '{d1_next}'
            GROUP BY sd.`Designer` HAVING COUNT(*) >= 10) c
      LEFT JOIN (SELECT sd.`Designer`, COUNT(*) AS n FROM Salesforce_Data sd JOIN dim_designers d ON d.`Designer` = sd.`Designer`
                 WHERE sd.`Revised Stage` = 'Sold' AND sd.`Original Project Sold Date` >= '{d0}' AND sd.`Original Project Sold Date` < '{d1_next}'
                 GROUP BY sd.`Designer`) s ON s.`Designer` = c.`Designer`
      ORDER BY `Closing %` DESC, `Created` DESC, c.`Designer`
    reference_dax: |
      EVALUATE
      VAR _t =
        CALCULATETABLE(
          ADDCOLUMNS(VALUES(dim_designers[Designer]),
                     "@c", [Projects Created (Period)], "@s", [Projects Sold (Period)], "@r", [Closing Rate]),
          DATESBETWEEN(DateTable[Date], {d0_dax}, {d1_dax})
        )
      RETURN
        SELECTCOLUMNS(FILTER(_t, [@c] >= 10 && NOT ISBLANK(dim_designers[Designer])),
                      "Designer", dim_designers[Designer], "Closing %", 100 * [@r] + 0, "Sold", [@s] + 0, "Created", [@c])
      ORDER BY [Closing %] DESC, [Created] DESC, [Designer]
    notes: "Per designer [Closing Rate] (capped at 100%) on the active roster (dim_designers, as the report's table and rules section 5), with the volume guard the question sets. The roster's blank member (projects of inactive designers) is left out (rules section 6); calibration caught it passing the volume guard in ICLA."

  - id: T112
    split: test
    source: system-dax cookbook (closing rate by lead source)
    types: [closing_rate]
    question: "What's our Salesforce-style closing % by lead source group this year?"
    franchises: [ICCH, ICAU]
    period: ytd
    date_basis: sold (numerator) / created (denominator)
    answer_shape: table
    result_columns: [Lead Source Group, Closing %, Sold, Created]
    col_types: {Lead Source Group: text, Closing %: percent, Sold: count, Created: count}
    label_column: Lead Source Group
    value_columns: [Closing %]
    reference_sql: |
      SELECT c.`Lead Source Group`, LEAST(100, 100 * COALESCE(s.n, 0) / c.n) AS `Closing %`, COALESCE(s.n, 0) AS `Sold`, c.n AS `Created`
      FROM (SELECT `Lead Source Group`, COUNT(*) AS n FROM Salesforce_Data
            WHERE `Created Date` >= '{d0}' AND `Created Date` < '{d1_next}' GROUP BY `Lead Source Group`) c
      LEFT JOIN (SELECT `Lead Source Group`, COUNT(*) AS n FROM Salesforce_Data
                 WHERE `Revised Stage` = 'Sold' AND `Original Project Sold Date` >= '{d0}' AND `Original Project Sold Date` < '{d1_next}'
                 GROUP BY `Lead Source Group`) s ON s.`Lead Source Group` = c.`Lead Source Group`
      ORDER BY c.`Lead Source Group`
    reference_dax: |
      EVALUATE
      VAR _t =
        CALCULATETABLE(
          ADDCOLUMNS(VALUES(Salesforce_Data[Lead Source Group]),
                     "@c", [Projects Created (Period)], "@s", [Projects Sold (Period)], "@r", [Closing Rate]),
          DATESBETWEEN(DateTable[Date], {d0_dax}, {d1_dax})
        )
      RETURN
        SELECTCOLUMNS(_t, "Lead Source Group", Salesforce_Data[Lead Source Group], "Closing %", 100 * [@r] + 0, "Sold", [@s] + 0, "Created", [@c])
      ORDER BY [Lead Source Group]
    notes: "The window must be set on DateTable (the measure reads MIN/MAX of DateTable[Date]); filtering the fact date columns leaves it at 2020-2030."

  - id: T113
    split: test
    source: recipe:BRK-001
    types: [closing_rate, cohort_funnel]
    question: "For projects created in the last 12 months, what's our closing % in each price range (sold out of all projects created)?"
    franchises: [ICLA, ICAU]
    period: last_12_months
    date_basis: created
    answer_shape: table
    result_columns: [Price Range, Closing %, Sold, Projects]
    col_types: {Price Range: text, Closing %: percent, Sold: count, Projects: count}
    label_column: Price Range
    value_columns: [Closing %, Projects]
    reference_sql: |
      SELECT CASE WHEN `Amount` <= 2500 THEN 'A. $0-$2,500' WHEN `Amount` <= 5000 THEN 'B. $2,500-$5,000'
                  WHEN `Amount` <= 10000 THEN 'C. $5,000-$10,000' WHEN `Amount` <= 15000 THEN 'D. $10,000-$15,000'
                  WHEN `Amount` <= 25000 THEN 'E. $15,000-$25,000' ELSE 'F. $25,000+' END AS `Price Range`,
             100 * SUM(`Revised Stage` = 'Sold') / COUNT(*) AS `Closing %`, SUM(`Revised Stage` = 'Sold') AS `Sold`, COUNT(*) AS `Projects`
      FROM Salesforce_Data
      WHERE `Amount` >= 0 AND `Created Date` >= '{d0}' AND `Created Date` < '{d1_next}'
      GROUP BY 1
      ORDER BY 1
    reference_dax: |
      EVALUATE
      VAR _b = DATATABLE("Price Range", STRING, "Lo", DOUBLE, "Hi", DOUBLE,
                 {{"A. $0-$2,500", -0.001, 2500}, {"B. $2,500-$5,000", 2500, 5000}, {"C. $5,000-$10,000", 5000, 10000},
                  {"D. $10,000-$15,000", 10000, 15000}, {"E. $15,000-$25,000", 15000, 25000}, {"F. $25,000+", 25000, 999999999}})
      VAR _t =
        ADDCOLUMNS(_b,
          "@n", VAR lo = [Lo] VAR hi = [Hi] RETURN
                COUNTROWS(FILTER(Salesforce_Data, Salesforce_Data[Amount] > lo && Salesforce_Data[Amount] <= hi
                                 && Salesforce_Data[Created Date] >= {d0_dax} && Salesforce_Data[Created Date] < {d1_next_dax})),
          "@s", VAR lo = [Lo] VAR hi = [Hi] RETURN
                COUNTROWS(FILTER(Salesforce_Data, Salesforce_Data[Amount] > lo && Salesforce_Data[Amount] <= hi
                                 && Salesforce_Data[Created Date] >= {d0_dax} && Salesforce_Data[Created Date] < {d1_next_dax}
                                 && Salesforce_Data[Revised Stage] = "Sold")))
      RETURN
        SELECTCOLUMNS(FILTER(_t, NOT ISBLANK([@n])), "Price Range", [Price Range], "Closing %", 100 * DIVIDE([@s], [@n]) + 0,
                      "Sold", [@s] + 0, "Projects", [@n])
      ORDER BY [Price Range]
    notes: "Recipe BRK-001's definition: Sold / all projects created in the bracket (Proposed included), brackets on Amount, last 12 months by created date; negative amounts left out. MySQL trap found in calibration: on the DECIMAL(18,2) Amount column, WHERE Amount > -0.001 behaves like Amount > 0 (the constant is rounded to the column's scale) and silently drops the zero-amount projects; Amount >= 0 is safe."

  - &T114
    id: T114
    split: test
    source: fresh
    types: [closing_rate, time_intelligence]
    question: "How has our Salesforce-style closing % moved month by month this year? Just the completed months."
    franchises: [ICLA, ICCH, ICAU]
    period: ytd_full_months
    date_basis: sold (numerator) / created (denominator)
    answer_shape: series
    result_columns: [Month, Closing %, Sold, Created]
    col_types: {Month: text, Closing %: percent, Sold: count, Created: count}
    label_column: Month
    value_columns: [Closing %]
    reference_sql: |
      SELECT c.ym AS `Month`, LEAST(100, 100 * COALESCE(s.n, 0) / c.n) AS `Closing %`, COALESCE(s.n, 0) AS `Sold`, c.n AS `Created`
      FROM (SELECT DATE_FORMAT(`Created Date`, '%Y-%m') AS ym, COUNT(*) AS n FROM Salesforce_Data
            WHERE `Created Date` >= '{d0}' AND `Created Date` < '{d1_next}' GROUP BY DATE_FORMAT(`Created Date`, '%Y-%m')) c
      LEFT JOIN (SELECT DATE_FORMAT(`Original Project Sold Date`, '%Y-%m') AS ym, COUNT(*) AS n FROM Salesforce_Data
                 WHERE `Revised Stage` = 'Sold' AND `Original Project Sold Date` >= '{d0}' AND `Original Project Sold Date` < '{d1_next}'
                 GROUP BY DATE_FORMAT(`Original Project Sold Date`, '%Y-%m')) s ON s.ym = c.ym
      ORDER BY `Month`
    reference_dax: |
      EVALUATE
      SELECTCOLUMNS(
        SUMMARIZECOLUMNS(DateTable[Year-Month], DATESBETWEEN(DateTable[Date], {d0_dax}, {d1_dax}),
                         "@r", [Closing Rate], "@s", [Projects Sold (Period)], "@c", [Projects Created (Period)]),
        "Month", DateTable[Year-Month], "Closing %", 100 * [@r] + 0, "Sold", [@s] + 0, "Created", [@c]
      )
      ORDER BY [Month]
    notes: "Each month is its own window (sold that month / created that month), capped at 100%."

  - id: T115
    split: test
    source: semantic-knowledge:Closing Rate (Cohort)
    types: [closing_rate]
    question: "What's our cohort closing rate this year: sales closed this year divided by projects created this year, leaving out dead leads?"
    franchises: [ICCH, ICAU]
    period: ytd
    date_basis: sold (numerator) / created (denominator)
    answer_shape: number
    result_columns: [Closing %, Sold, Created Excluding Dead Leads]
    col_types: {Closing %: percent, Sold: count, Created Excluding Dead Leads: count}
    headline: [Closing %]
    reference_sql: |
      SELECT 100 * s.n / c.n AS `Closing %`, s.n AS `Sold`, c.n AS `Created Excluding Dead Leads`
      FROM (SELECT COUNT(*) AS n FROM Salesforce_Data
            WHERE `Revised Stage` = 'Sold' AND `Original Project Sold Date` >= '{d0}' AND `Original Project Sold Date` < '{d1_next}') s
      CROSS JOIN (SELECT COUNT(*) AS n FROM Salesforce_Data
                  WHERE `Revised Stage` <> 'Dead Lead' AND `Created Date` >= '{d0}' AND `Created Date` < '{d1_next}') c
    reference_dax: |
      EVALUATE
      CALCULATETABLE(
        ROW("Closing %", 100 * [Closing Rate (Cohort)], "Sold", [Projects Sold (Cohort)], "Created Excluding Dead Leads", [Projects Created (Cohort)]),
        DATESBETWEEN(SoldDateTable[Date], {d0_dax}, {d1_dax})
      )
    notes: "[Closing Rate (Cohort)] reads its window from SoldDateTable. No cap."

  - id: T116
    split: test
    source: fresh
    types: [closing_rate]
    question: "Which designers won more than half of their decided projects created last year? Only designers with at least 20 decided projects."
    franchises: [ICLA, ICCH]
    period: last_year
    date_basis: created
    answer_shape: table
    result_columns: [Designer, Closing %, Sold, Decided]
    col_types: {Designer: text, Closing %: percent, Sold: count, Decided: count}
    label_column: Designer
    value_columns: [Closing %]
    reference_sql: |
      SELECT `Designer`, 100 * SUM(`Revised Stage` = 'Sold') / COUNT(*) AS `Closing %`, SUM(`Revised Stage` = 'Sold') AS `Sold`, COUNT(*) AS `Decided`
      FROM Salesforce_Data
      WHERE `Revised Stage` IN ('Sold', 'Lost', 'Dead Lead') AND `Created Date` >= '{d0}' AND `Created Date` < '{d1_next}'
      GROUP BY `Designer`
      HAVING COUNT(*) >= 20 AND SUM(`Revised Stage` = 'Sold') / COUNT(*) > 0.5
      ORDER BY `Closing %` DESC, `Designer`
    reference_dax: |
      EVALUATE
      VAR _t =
        ADDCOLUMNS(
          CALCULATETABLE(VALUES(Salesforce_Data[Designer]), DATESBETWEEN(DateTable[Date], {d0_dax}, {d1_dax})),
          "@d", CALCULATE([Count Total Projects], DATESBETWEEN(DateTable[Date], {d0_dax}, {d1_dax}),
                          Salesforce_Data[Revised Stage] IN {"Sold", "Lost", "Dead Lead"}),
          "@s", CALCULATE([Count Sold], DATESBETWEEN(DateTable[Date], {d0_dax}, {d1_dax}))
        )
      RETURN
        SELECTCOLUMNS(FILTER(_t, [@d] >= 20 && DIVIDE([@s], [@d]) > 0.5),
                      "Designer", Salesforce_Data[Designer], "Closing %", 100 * DIVIDE([@s], [@d]), "Sold", [@s], "Decided", [@d])
      ORDER BY [Closing %] DESC, [Designer]
    notes: "Count-based closing (the question defines it): Sold / (Sold + Lost + Dead Lead), created last year."

