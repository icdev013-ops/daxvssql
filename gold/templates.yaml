  - id: T074
    split: test
    source: fresh
    types: [appointments_sales, cohort_funnel]
    question: "For the projects we sold this year, how many days did it take on average from the first appointment to the sale?"
    franchises: [ICLA, ICAU]
    period: ytd
    date_basis: franchise_sales
    answer_shape: number
    result_columns: [Average Days, Projects]
    col_types: {Average Days: number, Projects: count}
    headline: [Average Days]
    reference_sql: |
      SELECT AVG(DATEDIFF(s.`Original Project Sold Date`, f.first_appt)) AS `Average Days`, COUNT(*) AS `Projects`
      FROM Salesforce_Data s
      JOIN (SELECT `Project Name` AS pn, MIN(`Appointment Start Time`) AS first_appt
            FROM Appointments
            WHERE {appt_rule_sql} AND `Project Name` IS NOT NULL AND `Project Name` <> ''
            GROUP BY `Project Name`) f ON f.pn = s.`Project Name`
      WHERE s.`Revised Stage` = 'Sold' AND {sales_date_sql} >= '{d0}' AND {sales_date_sql} < '{d1_next}'
        AND f.first_appt <= s.`Original Project Sold Date`
    reference_dax: |
      EVALUATE
      VAR _rows =
        ADDCOLUMNS(
          FILTER(Salesforce_Data, Salesforce_Data[Revised Stage] = "Sold"
                 && {sales_date_dax} >= {d0_dax} && {sales_date_dax} < {d1_next_dax}),
          "@fa", VAR _p = Salesforce_Data[Project Name]
                 RETURN MINX(FILTER(ALL(Appointments), Appointments[Project Name] = _p && {appt_rule_pred_dax}),
                             Appointments[Appointment Start Time])
        )
      VAR _ok = FILTER(_rows, NOT ISBLANK([@fa]) && [@fa] <= Salesforce_Data[Original Project Sold Date])
      RETURN
        ROW(
          "Average Days", AVERAGEX(_ok, DATEDIFF([@fa], Salesforce_Data[Original Project Sold Date], DAY)),
          "Projects", COUNTROWS(_ok)
        )
    notes: "First appointment = earliest Appointment Start Time on that Project Name under the franchise rule; projects with no appointment on or before the sale are left out (the calendar keeps about 12 months)."

  - id: T075
    split: test
    source: system-dax cookbook (appointment success by source)
    types: [appointments_sales, appointments_rules, ranking]
    question: "Which lead source channel's appointments turned into sales most often this year? Only channels with at least 20 appointments, and leave out entries with no source."
    franchises: [ICCH, ICAU]
    period: ytd
    date_basis: appointment_start
    answer_shape: ranked_list
    result_columns: [Lead Source Channel, Success Rate, Sold-Project Appointments, Appointments]
    col_types: {Lead Source Channel: text, Success Rate: percent, Sold-Project Appointments: count, Appointments: count}
    label_column: Lead Source Channel
    value_columns: [Success Rate]
    top_k: 3
    order_by: {column: Success Rate, direction: desc, ties: either order accepted}
    reference_sql: |
      SELECT `Lead Source Channel`, 100 * SUM(`Project Stage` = 'Sold') / COUNT(*) AS `Success Rate`,
             SUM(`Project Stage` = 'Sold') AS `Sold-Project Appointments`, COUNT(*) AS `Appointments`
      FROM Appointments
      WHERE {appt_rule_sql} AND `Appointment Start Time` >= '{d0}' AND `Appointment Start Time` < '{d1_next}'
        AND `Lead Source Channel` IS NOT NULL AND `Lead Source Channel` <> ''
      GROUP BY `Lead Source Channel`
      HAVING COUNT(*) >= 20
      ORDER BY `Success Rate` DESC, `Appointments` DESC, `Lead Source Channel`
    reference_dax: |
      EVALUATE
      VAR _t =
        ADDCOLUMNS(
          VALUES(Appointments[Lead Source Channel]),
          "@a", CALCULATE([Total Activity Count], {appt_rule_dax},
                          KEEPFILTERS(Appointments[Appointment Start Time] >= {d0_dax}),
                          KEEPFILTERS(Appointments[Appointment Start Time] < {d1_next_dax})),
          "@s", CALCULATE([Sold Project Count], {appt_rule_dax},
                          KEEPFILTERS(Appointments[Appointment Start Time] >= {d0_dax}),
                          KEEPFILTERS(Appointments[Appointment Start Time] < {d1_next_dax}))
        )
      RETURN
        SELECTCOLUMNS(
          FILTER(_t, [@a] >= 20 && Appointments[Lead Source Channel] <> ""),
          "Lead Source Channel", Appointments[Lead Source Channel], "Success Rate", 100 * DIVIDE([@s], [@a]),
          "Sold-Project Appointments", [@s] + 0, "Appointments", [@a]
        )
      ORDER BY [Success Rate] DESC, [Appointments] DESC, [Lead Source Channel]

  - id: T076
    split: test
    source: fresh
    types: [appointments_sales, cohort_funnel]
    question: "How much have we sold from projects whose first appointment was last quarter?"
    franchises: [ICLA, ICCH]
    period: last_quarter
    date_basis: appointment_start
    answer_shape: number
    result_columns: [Projects, Sold Projects, Sold Amount]
    col_types: {Projects: count, Sold Projects: count, Sold Amount: currency}
    headline: [Sold Amount, Sold Projects]
    reference_sql: |
      WITH f AS (
        SELECT `Project Name` AS pn, MIN(`Appointment Start Time`) AS fa
        FROM Appointments
        WHERE {appt_rule_sql} AND `Project Name` IS NOT NULL AND `Project Name` <> ''
        GROUP BY `Project Name`
      )
      SELECT (SELECT COUNT(*) FROM f WHERE fa >= '{d0}' AND fa < '{d1_next}') AS `Projects`,
             COUNT(s.`Project Name`) AS `Sold Projects`, SUM(s.`Amount`) AS `Sold Amount`
      FROM Salesforce_Data s JOIN f ON f.pn = s.`Project Name`
      WHERE s.`Revised Stage` = 'Sold' AND f.fa >= '{d0}' AND f.fa < '{d1_next}'
    reference_dax: |
      EVALUATE
      VAR _f =
        FILTER(
          ADDCOLUMNS(CALCULATETABLE(VALUES(Appointments[Project Name]), {appt_rule_dax}),
                     "@fa", CALCULATE(MIN(Appointments[Appointment Start Time]), {appt_rule_dax})),
          Appointments[Project Name] <> "" && [@fa] >= {d0_dax} && [@fa] < {d1_next_dax})
      VAR _names = SELECTCOLUMNS(_f, "pn", Appointments[Project Name])
      RETURN
        ROW(
          "Projects", COUNTROWS(_f),
          "Sold Projects", CALCULATE([Count Sold], TREATAS(_names, Salesforce_Data[Project Name])) + 0,
          "Sold Amount", CALCULATE([Revenue Sold], TREATAS(_names, Salesforce_Data[Project Name]))
        )
    notes: "Cohort = Project Names whose earliest appointment (franchise rule) fell last quarter; sold whenever."

