  - &T005
    id: T005
    split: test
    source: prodlog
    types: [sold_vs_created, time_intelligence]
    question: "Show me our sales by month for this year so far."
    franchises: [ICLA, ICCH, ICAU]
    period: ytd
    date_basis: franchise_sales
    answer_shape: series
    result_columns: [Month, Sold Amount, Sold Count]
    col_types: {Month: text, Sold Amount: currency, Sold Count: count}
    label_column: Month
    value_columns: [Sold Amount, Sold Count]
    reference_sql: &sold_by_month_sql |
      SELECT DATE_FORMAT({sales_date_sql}, '%Y-%m') AS `Month`, SUM(`Amount`) AS `Sold Amount`, COUNT(*) AS `Sold Count`
      FROM Salesforce_Data
      WHERE `Revised Stage` = 'Sold'
        AND {sales_date_sql} >= '{d0}' AND {sales_date_sql} < '{d1_next}'
      GROUP BY DATE_FORMAT({sales_date_sql}, '%Y-%m')
      ORDER BY `Month`
    reference_dax: &sold_by_month_dax |
      EVALUATE
      SELECTCOLUMNS(
        SUMMARIZECOLUMNS(
          {sales_cal_dax}[Year-Month],
          DATESBETWEEN({sales_cal_dax}[Date], {d0_dax}, {d1_dax}),
          "@amt", [Revenue Sold], "@n", [Count Sold]
        ),
        "Month", {sales_cal_dax}[Year-Month], "Sold Amount", [@amt], "Sold Count", [@n]
      )
      ORDER BY [Month]
    notes: "One row per month from January to the anchor month (partial), franchise basis. Months with no sales are absent in both references."

  - &T006
    id: T006
    split: test
    source: e2e170:Q031
    types: [sold_vs_created, time_intelligence]
    question: "How are sales this year compared with the same point last year?"
    franchises: [ICLA, ICCH, ICAU]
    period: ytd
    periods: {prev: last_year_ytd}
    date_basis: franchise_sales
    answer_shape: number
    result_columns: [Sold Amount This Year, Sold Amount Same Period Last Year, Change %]
    col_types: {Sold Amount This Year: currency, Sold Amount Same Period Last Year: currency, Change %: percent}
    headline: [Sold Amount This Year, Sold Amount Same Period Last Year]
    reference_sql: |
      SELECT t.ty AS `Sold Amount This Year`, t.ly AS `Sold Amount Same Period Last Year`,
             100 * (t.ty - t.ly) / t.ly AS `Change %`
      FROM (
        SELECT SUM(CASE WHEN {sales_date_sql} >= '{d0}' AND {sales_date_sql} < '{d1_next}' THEN `Amount` END) AS ty,
               SUM(CASE WHEN {sales_date_sql} >= '{prev.d0}' AND {sales_date_sql} < '{prev.d1_next}' THEN `Amount` END) AS ly
        FROM Salesforce_Data WHERE `Revised Stage` = 'Sold'
      ) t
    reference_dax: |
      EVALUATE
      VAR _ty = CALCULATE([Revenue Sold], DATESBETWEEN({sales_cal_dax}[Date], {d0_dax}, {d1_dax}))
      VAR _ly = CALCULATE([Revenue Sold], DATESBETWEEN({sales_cal_dax}[Date], {prev.d0_dax}, {prev.d1_dax}))
      RETURN ROW("Sold Amount This Year", _ty, "Sold Amount Same Period Last Year", _ly, "Change %", 100 * DIVIDE(_ty - _ly, _ly))
    notes: "Same-day comparison: Jan 1 to the anchor date this year vs Jan 1 to the same date last year, franchise basis."

