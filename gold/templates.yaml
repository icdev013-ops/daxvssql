      FROM Salesforce_Data
      WHERE `Revised Stage` = 'Sold' AND `Lead Source` = {lead_source|sql}
        AND {sales_date_sql} >= '{d0}' AND {sales_date_sql} < '{d1_next}'
      ORDER BY `Amount` DESC, `Project Name`
    reference_dax: |
      EVALUATE
      SELECTCOLUMNS(
        FILTER(Salesforce_Data, Salesforce_Data[Revised Stage] = "Sold" && Salesforce_Data[Lead Source] = {lead_source|dax}
               && {sales_date_dax} >= {d0_dax} && {sales_date_dax} < {d1_next_dax}),
        "Project Name", Salesforce_Data[Project Name], "Designer", Salesforce_Data[Designer], "Amount", Salesforce_Data[Amount],
