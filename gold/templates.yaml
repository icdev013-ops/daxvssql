  # opportunity rows whose name matches.

  - &T071
    id: T071
    split: test
    source: recipe:APT-004
    types: [appointments_sales, appointments_rules]
    question: "What share of this year's appointments were for projects that ended up sold?"
    franchises: [ICLA, ICCH, ICAU]
    period: ytd
    date_basis: appointment_start
    answer_shape: number
    result_columns: [Success Rate, Sold-Project Appointments, Appointments]
