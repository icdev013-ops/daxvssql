  - id: T011
    split: test
    source: fresh
    types: [time_intelligence, sold_vs_created]
    question: "Give me weekly sales for the last 8 full weeks."
    franchises: [ICCH, ICAU]
    period: last_8_full_weeks
    date_basis: franchise_sales
    answer_shape: series
    result_columns: [Week Start, Sold Amount, Sold Count]
    col_types: {Week Start: date, Sold Amount: currency, Sold Count: count}
    label_column: Week Start
    value_columns: [Sold Amount, Sold Count]
    reference_sql: |
      SELECT DATE(DATE_SUB({sales_date_sql}, INTERVAL DAYOFWEEK({sales_date_sql}) - 1 DAY)) AS `Week Start`,
             SUM(`Amount`) AS `Sold Amount`, COUNT(*) AS `Sold Count`
      FROM Salesforce_Data
      WHERE `Revised Stage` = 'Sold' AND {sales_date_sql} >= '{d0}' AND {sales_date_sql} < '{d1_next}'
      GROUP BY DATE(DATE_SUB({sales_date_sql}, INTERVAL DAYOFWEEK({sales_date_sql}) - 1 DAY))
      ORDER BY `Week Start`
    reference_dax: |
      EVALUATE
      SELECTCOLUMNS(
        SUMMARIZECOLUMNS(
          {sales_cal_dax}[Start Of Week],
          DATESBETWEEN({sales_cal_dax}[Date], {d0_dax}, {d1_dax}),
          "@amt", [Revenue Sold], "@n", [Count Sold]
        ),
        "Week Start", {sales_cal_dax}[Start Of Week], "Sold Amount", [@amt], "Sold Count", [@n]
      )
      ORDER BY [Week Start]
