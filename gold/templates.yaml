    result_columns: [Average Sale, Sold Count]
    col_types: {Average Sale: currency, Sold Count: count}
    headline: [Average Sale]
    reference_sql: |
      SELECT SUM(`Amount`) / COUNT(*) AS `Average Sale`, COUNT(*) AS `Sold Count`
      FROM Salesforce_Data
      WHERE `Revised Stage` = 'Sold' AND {sales_date_sql} >= '{d0}' AND {sales_date_sql} < '{d1_next}'
    reference_dax: |
      EVALUATE
      ROW(
        "Average Sale", CALCULATE([Average Project Value Sold], DATESBETWEEN({sales_cal_dax}[Date], {d0_dax}, {d1_dax})),
        "Sold Count", CALCULATE([Count Sold], DATESBETWEEN({sales_cal_dax}[Date], {d0_dax}, {d1_dax}))
      )
    notes: "Average Project Value Sold = sold amount / sold count (not [APV], which drops deals under $1,000 and mixes stages)."

  - id: T008
    split: test
    source: fresh
    types: [sold_vs_created, time_intelligence]
    question: "How much have we sold so far this month, and how does that compare with the same days last month?"
    franchises: [ICCH, ICAU]
    period: mtd
    periods: {prev: last_month_mtd}
    date_basis: franchise_sales
    answer_shape: number
    result_columns: [Sold Amount This Month, Sold Amount Same Days Last Month]
    col_types: {Sold Amount This Month: currency, Sold Amount Same Days Last Month: currency}
    headline: [Sold Amount This Month, Sold Amount Same Days Last Month]
    reference_sql: |
      SELECT SUM(CASE WHEN {sales_date_sql} >= '{d0}' AND {sales_date_sql} < '{d1_next}' THEN `Amount` END) AS `Sold Amount This Month`,
             SUM(CASE WHEN {sales_date_sql} >= '{prev.d0}' AND {sales_date_sql} < '{prev.d1_next}' THEN `Amount` END) AS `Sold Amount Same Days Last Month`
      FROM Salesforce_Data WHERE `Revised Stage` = 'Sold'
    reference_dax: |
      EVALUATE
      ROW(
        "Sold Amount This Month", CALCULATE([Revenue Sold], DATESBETWEEN({sales_cal_dax}[Date], {d0_dax}, {d1_dax})),
        "Sold Amount Same Days Last Month", CALCULATE([Revenue Sold], DATESBETWEEN({sales_cal_dax}[Date], {prev.d0_dax}, {prev.d1_dax}))
      )
    alternates:
      - label: the weekly report's scorecard, current_mtd vs prior_mtd (rules section 9)
        reference_sql: |
          SELECT MAX(CASE WHEN r.`window_name` = 'current_mtd' THEN r.`value` END) AS `Sold Amount This Month`,
                 MAX(CASE WHEN r.`window_name` = 'prior_mtd' THEN r.`value` END) AS `Sold Amount Same Days Last Month`
          FROM report_scorecard r
          WHERE r.`report_date` = (SELECT MAX(`report_date`) FROM report_scorecard) AND r.`metric_key` = 'sold_dollars'
        reference_dax: |
          EVALUATE
          VAR _d = MAXX(ALL(report_scorecard[report_date]), report_scorecard[report_date])
          RETURN ROW(
            "Sold Amount This Month", CALCULATE(MAX(report_scorecard[value]), report_scorecard[report_date] = _d, report_scorecard[metric_key] = "sold_dollars", report_scorecard[window_name] = "current_mtd"),
            "Sold Amount Same Days Last Month", CALCULATE(MAX(report_scorecard[value]), report_scorecard[report_date] = _d, report_scorecard[metric_key] = "sold_dollars", report_scorecard[window_name] = "prior_mtd"))
    notes: "Day-matched: the 1st to the anchor day of this month vs the 1st to the same day of last month. Rules section 9 answers 'this month' sales from the weekly report; its scorecard windows are the alternate and should give the same figures."

  - id: T009
    split: test
    source: fresh
    types: [sold_vs_created, time_intelligence]
    question: "Break down last year's sales by quarter."
    franchises: [ICLA, ICAU]
    period: last_year
    date_basis: franchise_sales
    answer_shape: series
    result_columns: [Quarter, Sold Amount, Sold Count]
    col_types: {Quarter: text, Sold Amount: currency, Sold Count: count}
    label_column: Quarter
    value_columns: [Sold Amount, Sold Count]
    reference_sql: |
      SELECT CONCAT(YEAR({sales_date_sql}), ' Q', QUARTER({sales_date_sql})) AS `Quarter`,
             SUM(`Amount`) AS `Sold Amount`, COUNT(*) AS `Sold Count`
      FROM Salesforce_Data
      WHERE `Revised Stage` = 'Sold' AND {sales_date_sql} >= '{d0}' AND {sales_date_sql} < '{d1_next}'
      GROUP BY CONCAT(YEAR({sales_date_sql}), ' Q', QUARTER({sales_date_sql}))
      ORDER BY `Quarter`
    reference_dax: |
      EVALUATE
      SELECTCOLUMNS(
        SUMMARIZECOLUMNS(
          {sales_cal_dax}[YearQuarter],
          DATESBETWEEN({sales_cal_dax}[Date], {d0_dax}, {d1_dax}),
          "@amt", [Revenue Sold], "@n", [Count Sold]
        ),
        "Quarter", {sales_cal_dax}[YearQuarter], "Sold Amount", [@amt], "Sold Count", [@n]
      )
      ORDER BY [Quarter]
    notes: "Quarter labels look like '2025 Q1'. Franchise basis."

