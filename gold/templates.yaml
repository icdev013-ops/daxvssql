  - &T096
    id: T096
    split: test
    source: recipe:LJ-002
    types: [cohort_funnel]
    question: "How many leads that went into lead nurturing have come back out of it?"
    franchises: [ICLA, ICCH, ICAU]
    period: all_time
    date_basis: none
    answer_shape: number
    result_columns: [Leads Back From Nurturing, Leads Ever In Nurturing]
    col_types: {Leads Back From Nurturing: count, Leads Ever In Nurturing: count}
    headline: [Leads Back From Nurturing]
    reference_sql: |
      SELECT COUNT(DISTINCT CASE WHEN COALESCE(`Current Status`, '') <> 'Lead Nurturing' THEN `Lead ID` END) AS `Leads Back From Nurturing`,
             COUNT(DISTINCT `Lead ID`) AS `Leads Ever In Nurturing`
      FROM Leads_Journey WHERE `Lead Journey` LIKE '%Lead Nurturing%'
    reference_dax: |
      EVALUATE
      ROW(
        "Leads Back From Nurturing", CALCULATE(DISTINCTCOUNT(Leads_Journey[Lead ID]),
                                               CONTAINSSTRING(Leads_Journey[Lead Journey], "Lead Nurturing"),
                                               Leads_Journey[Current Status] <> "Lead Nurturing"),
        "Leads Ever In Nurturing", CALCULATE(DISTINCTCOUNT(Leads_Journey[Lead ID]), CONTAINSSTRING(Leads_Journey[Lead Journey], "Lead Nurturing"))
      )
    notes: "From the lead status history (Leads_Journey): the journey passed through Lead Nurturing and the current status is something else. History starts in 2025."

  - id: T097
    split: test
    source: recipe:LJ-003
    types: [cohort_funnel]
    question: "How many projects that were ever in lead nurturing ended up sold, and for how much?"
    franchises: [ICCH, ICAU]
    period: all_time
    date_basis: none
    answer_shape: number
    result_columns: [Sold Projects, Sold Amount]
    col_types: {Sold Projects: count, Sold Amount: currency}
    headline: [Sold Projects, Sold Amount]
    reference_sql: |
      SELECT COUNT(*) AS `Sold Projects`, SUM(`Amount`) AS `Sold Amount`
      FROM Salesforce_Data
      WHERE `Revised Stage` = 'Sold'
        AND `Project Name` IN (SELECT l.`Converted Project Name` FROM Leads l JOIN Leads_Journey j ON j.`Lead ID` = l.`Lead ID`
                               WHERE j.`Lead Journey` LIKE '%Lead Nurturing%'
                                 AND l.`Converted Project Name` IS NOT NULL AND l.`Converted Project Name` <> '')
    reference_dax: |
      EVALUATE
      VAR _p = FILTER(CALCULATETABLE(VALUES(Leads[Converted Project Name]), CONTAINSSTRING(Leads_Journey[Lead Journey], "Lead Nurturing")),
                      Leads[Converted Project Name] <> "")
      RETURN
        ROW(
          "Sold Projects", CALCULATE([Count Sold], TREATAS(_p, Salesforce_Data[Project Name])) + 0,
          "Sold Amount", CALCULATE([Revenue Sold], TREATAS(_p, Salesforce_Data[Project Name]))
        )
    notes: "Lead -> converted project name -> opportunity now Sold. Not the count of 'Moved to Studio' leads."

