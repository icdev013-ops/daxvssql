  - id: T118
    split: test
    source: e2e170:Q035
    types: [closing_rate, time_intelligence]
    question: "Is our closing rate by count (sold out of sold, lost and dead lead, by created date) better or worse than at this point last year?"
    franchises: [ICLA, ICAU]
    period: ytd
    periods: {prev: last_year_ytd}
    date_basis: created
    answer_shape: number
    result_columns: [Closing % This Year, Closing % Same Period Last Year]
    col_types: {Closing % This Year: percent, Closing % Same Period Last Year: percent}
    headline: [Closing % This Year, Closing % Same Period Last Year]
    reference_sql: |
      SELECT 100 * SUM(`Created Date` >= '{d0}' AND `Created Date` < '{d1_next}' AND `Revised Stage` = 'Sold')
                 / SUM(`Created Date` >= '{d0}' AND `Created Date` < '{d1_next}') AS `Closing % This Year`,
             100 * SUM(`Created Date` >= '{prev.d0}' AND `Created Date` < '{prev.d1_next}' AND `Revised Stage` = 'Sold')
                 / SUM(`Created Date` >= '{prev.d0}' AND `Created Date` < '{prev.d1_next}') AS `Closing % Same Period Last Year`
      FROM Salesforce_Data WHERE `Revised Stage` IN ('Sold', 'Lost', 'Dead Lead')
    reference_dax: |
      EVALUATE
      VAR _decided = {"Sold", "Lost", "Dead Lead"}
      VAR _sy = CALCULATE([Count Sold], DATESBETWEEN(DateTable[Date], {d0_dax}, {d1_dax}))
      VAR _dy = CALCULATE([Count Total Projects], DATESBETWEEN(DateTable[Date], {d0_dax}, {d1_dax}), Salesforce_Data[Revised Stage] IN _decided)
      VAR _sp = CALCULATE([Count Sold], DATESBETWEEN(DateTable[Date], {prev.d0_dax}, {prev.d1_dax}))
      VAR _dp = CALCULATE([Count Total Projects], DATESBETWEEN(DateTable[Date], {prev.d0_dax}, {prev.d1_dax}), Salesforce_Data[Revised Stage] IN _decided)
      RETURN ROW("Closing % This Year", 100 * DIVIDE(_sy, _dy), "Closing % Same Period Last Year", 100 * DIVIDE(_sp, _dp))
    notes: "Same-day windows. Last year's cohort has had more time to be decided, which the answer may point out."

