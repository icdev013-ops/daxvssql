    types: [ranking, sold_vs_created]
    question: "Which designer has the biggest average sale this year? Only count designers with at least 10 sales."
    franchises: [ICCH, ICAU]
    period: ytd
    date_basis: franchise_sales
    answer_shape: ranked_list
    result_columns: [Designer, Average Sale, Sold Count]
    col_types: {Designer: text, Average Sale: currency, Sold Count: count}
    label_column: Designer
    value_columns: [Average Sale]
    top_k: 3
    order_by: {column: Average Sale, direction: desc, ties: either order accepted}
    reference_sql: |
      SELECT `Designer`, SUM(`Amount`) / COUNT(*) AS `Average Sale`, COUNT(*) AS `Sold Count`
      FROM Salesforce_Data
      WHERE `Revised Stage` = 'Sold' AND {sales_date_sql} >= '{d0}' AND {sales_date_sql} < '{d1_next}'
      GROUP BY `Designer`
      HAVING COUNT(*) >= 10
      ORDER BY `Average Sale` DESC, `Designer`
    reference_dax: |
      EVALUATE
      SELECTCOLUMNS(
        FILTER(
          SUMMARIZECOLUMNS(
            Salesforce_Data[Designer],
            DATESBETWEEN({sales_cal_dax}[Date], {d0_dax}, {d1_dax}),
            "@avg", [Average Project Value Sold], "@n", [Count Sold]
          ),
          [@n] >= 10
        ),
        "Designer", Salesforce_Data[Designer], "Average Sale", [@avg], "Sold Count", [@n]
      )
      ORDER BY [Average Sale] DESC, [Designer]

