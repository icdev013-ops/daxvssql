                         KEEPFILTERS(Appointments[Appointment Start Time] >= {d0_dax}),
                         KEEPFILTERS(Appointments[Appointment Start Time] < {d1_next_dax}))
      VAR _a = CALCULATE([Total Activity Count], {appt_rule_dax},
                         KEEPFILTERS(Appointments[Appointment Start Time] >= {d0_dax}),
                         KEEPFILTERS(Appointments[Appointment Start Time] < {d1_next_dax}))
      RETURN ROW("Design Share", 100 * DIVIDE(_d, _a), "Design Appointments", _d, "Appointments", _a)
    notes: "Denominator = all appointments under the franchise rule (Chicago and Austin rules keep task rows, Activity Type 'Unspecified')."

