  # =====================================================================================
  # AMBIGUITY: pass on any listed reading (stated as the assumption) or on a clarifying
  # question. Each reading has its own references. The first reading is the rules' default.
  # =====================================================================================

  - id: A01
    split: ambiguity
    source: plan
    types: [closing_rate]
    question: "What's our closing rate?"
    franchises: [ICCH, ICAU]
    answer_shape: rubric
    rubric:
      - "answers with one of the listed readings and names the definition and window, or asks which closing rate is meant"
      - "the number matches the reading it names"
    readings:
      - label: C1 Salesforce Community closing rate, year to date (rules default)
        period: ytd
        result_columns: [Closing %, Sold, Created]
        col_types: {Closing %: percent, Sold: count, Created: count}
        reference_sql: *c1_window_sql
        reference_dax: *c1_window_dax
      - label: C4 count-based (sold out of decided), created year to date
        period: ytd
        result_columns: [Closing %, Sold, Decided]
        col_types: {Closing %: percent, Sold: count, Decided: count}
        reference_sql: |
          SELECT 100 * SUM(`Revised Stage` = 'Sold') / COUNT(*) AS `Closing %`, SUM(`Revised Stage` = 'Sold') AS `Sold`, COUNT(*) AS `Decided`
          FROM Salesforce_Data
          WHERE `Revised Stage` IN ('Sold', 'Lost', 'Dead Lead') AND `Created Date` >= '{d0}' AND `Created Date` < '{d1_next}'
        reference_dax: |
          EVALUATE
          VAR _s = CALCULATE([Count Sold], DATESBETWEEN(DateTable[Date], {d0_dax}, {d1_dax}))
          VAR _d = CALCULATE([Count Total Projects], DATESBETWEEN(DateTable[Date], {d0_dax}, {d1_dax}), Salesforce_Data[Revised Stage] IN {"Sold", "Lost", "Dead Lead"})
          RETURN ROW("Closing %", 100 * DIVIDE(_s, _d), "Sold", _s, "Decided", _d)
      - label: C2 cohort closing rate (Dead Lead excluded), year to date
        period: ytd
        result_columns: [Closing %, Sold, Created Excluding Dead Leads]
        col_types: {Closing %: percent, Sold: count, Created Excluding Dead Leads: count}
        reference_sql: |
          SELECT 100 * s.n / c.n AS `Closing %`, s.n AS `Sold`, c.n AS `Created Excluding Dead Leads`
          FROM (SELECT COUNT(*) AS n FROM Salesforce_Data
                WHERE `Revised Stage` = 'Sold' AND `Original Project Sold Date` >= '{d0}' AND `Original Project Sold Date` < '{d1_next}') s
          CROSS JOIN (SELECT COUNT(*) AS n FROM Salesforce_Data
                      WHERE `Revised Stage` <> 'Dead Lead' AND `Created Date` >= '{d0}' AND `Created Date` < '{d1_next}') c
        reference_dax: |
          EVALUATE
          CALCULATETABLE(
            ROW("Closing %", 100 * [Closing Rate (Cohort)], "Sold", [Projects Sold (Cohort)], "Created Excluding Dead Leads", [Projects Created (Cohort)]),
            DATESBETWEEN(SoldDateTable[Date], {d0_dax}, {d1_dax})
          )

