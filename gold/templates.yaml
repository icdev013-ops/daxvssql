          WHERE `Lead Status` IN ('Junk', 'Duplicate', 'Cancelled') AND `Lead Created Date` >= '{d0}' AND `Lead Created Date` < '{d1_next}'
        reference_dax: |
          EVALUATE ROW("Lost Leads", CALCULATE([Lost Lead Count], DATESBETWEEN(DateTable[Date], {d0_dax}, {d1_dax})) + 0)
      - label: lost projects (Revised Stage Lost), created this year
        period: ytd
        result_columns: [Lost Projects]
        col_types: {Lost Projects: count}
        reference_sql: |
          SELECT COUNT(*) AS `Lost Projects` FROM Salesforce_Data
          WHERE `Revised Stage` = 'Lost' AND `Created Date` >= '{d0}' AND `Created Date` < '{d1_next}'
        reference_dax: |
          EVALUATE ROW("Lost Projects", CALCULATE([Count Lost], DATESBETWEEN(DateTable[Date], {d0_dax}, {d1_dax})))

  - id: A06
    split: ambiguity
    source: rules section 3
    types: []
    question: "What's our average deal size?"
    franchises: [ICCH]
    answer_shape: rubric
    rubric:
      - "answers with one of the listed readings and names which average it used, or asks"
      - "the number matches the reading it names"
    readings:
      - label: average sale (sold revenue / sold count), all time (rules default, no period named)
        period: all_time
        result_columns: [Average Sale, Sold Count]
        col_types: {Average Sale: currency, Sold Count: count}
        reference_sql: |
          SELECT SUM(`Amount`) / COUNT(*) AS `Average Sale`, COUNT(*) AS `Sold Count` FROM Salesforce_Data WHERE `Revised Stage` = 'Sold'
        reference_dax: |
          EVALUATE ROW("Average Sale", [Average Project Value Sold], "Sold Count", [Count Sold])
      - label: average sale this year (franchise basis)
        period: ytd
        result_columns: [Average Sale, Sold Count]
        col_types: {Average Sale: currency, Sold Count: count}
        reference_sql: |
          SELECT SUM(`Amount`) / COUNT(*) AS `Average Sale`, COUNT(*) AS `Sold Count` FROM Salesforce_Data
          WHERE `Revised Stage` = 'Sold' AND {sales_date_sql} >= '{d0}' AND {sales_date_sql} < '{d1_next}'
        reference_dax: |
          EVALUATE ROW("Average Sale", CALCULATE([Average Project Value Sold], DATESBETWEEN({sales_cal_dax}[Date], {d0_dax}, {d1_dax})),
                       "Sold Count", CALCULATE([Count Sold], DATESBETWEEN({sales_cal_dax}[Date], {d0_dax}, {d1_dax})))
      - label: average amount over all projects (all stages), all time
        period: all_time
        result_columns: [Average Amount, Projects]
        col_types: {Average Amount: currency, Projects: count}
        reference_sql: |
          SELECT AVG(`Amount`) AS `Average Amount`, COUNT(*) AS `Projects` FROM Salesforce_Data
        reference_dax: |
          EVALUATE ROW("Average Amount", AVERAGE(Salesforce_Data[Amount]), "Projects", [Count Total Projects])
      - label: average project value of deals over $1,000 ([APV]), all time
        period: all_time
        result_columns: [APV, Projects Over 1000]
        col_types: {APV: currency, Projects Over 1000: count}
        reference_sql: |
          SELECT AVG(`Amount`) AS `APV`, COUNT(*) AS `Projects Over 1000` FROM Salesforce_Data WHERE `Amount` > 1000
        reference_dax: |
          EVALUATE ROW("APV", [APV], "Projects Over 1000", [Total Records (>1000)])

  - id: A07
    split: ambiguity
    source: prodlog
    types: [sold_vs_created, closing_rate]
    question: "How's {designer} doing?"
    franchises: [ICLA]
    params:
      designer:
        description: "designer with the second-highest sold amount this year (franchise basis)"
        param_sql: |
          SELECT `Designer` FROM Salesforce_Data
          WHERE `Revised Stage` = 'Sold' AND {sales_date_sql} >= '{anchor_year}-01-01' AND {sales_date_sql} < '{anchor_next}'
          GROUP BY `Designer` ORDER BY SUM(`Amount`) DESC, `Designer` LIMIT 1 OFFSET 1
    answer_shape: rubric
    rubric:
      - "gives sales this year (franchise basis) and all time (rule 6), and/or the designer's C1 closing rate year to date, naming each metric; or asks which measure is wanted"
      - "numbers match the reading they belong to"
      - "does not judge the person"
    readings:
      - label: sales this year (franchise basis) and all time (rule 6)
        period: ytd
        result_columns: [Sold Amount This Year, Sold Amount All Time]
        col_types: {Sold Amount This Year: currency, Sold Amount All Time: currency}
        reference_sql: |
          SELECT SUM(CASE WHEN {sales_date_sql} >= '{d0}' AND {sales_date_sql} < '{d1_next}' THEN `Amount` END) AS `Sold Amount This Year`,
                 SUM(`Amount`) AS `Sold Amount All Time`
          FROM Salesforce_Data WHERE `Revised Stage` = 'Sold' AND `Designer` = {designer|sql}
        reference_dax: |
          EVALUATE
          ROW(
            "Sold Amount This Year", CALCULATE([Revenue Sold], Salesforce_Data[Designer] = {designer|dax}, DATESBETWEEN({sales_cal_dax}[Date], {d0_dax}, {d1_dax})),
            "Sold Amount All Time", CALCULATE([Revenue Sold], Salesforce_Data[Designer] = {designer|dax})
          )
      - label: the designer's C1 closing rate, year to date
        period: ytd
        result_columns: [Closing %, Sold, Created]
        col_types: {Closing %: percent, Sold: count, Created: count}
        reference_sql: |
          SELECT LEAST(100, 100 * s.n / c.n) AS `Closing %`, s.n AS `Sold`, c.n AS `Created`
          FROM (SELECT COUNT(*) AS n FROM Salesforce_Data WHERE `Designer` = {designer|sql} AND `Revised Stage` = 'Sold'
                  AND `Original Project Sold Date` >= '{d0}' AND `Original Project Sold Date` < '{d1_next}') s
          CROSS JOIN (SELECT COUNT(*) AS n FROM Salesforce_Data WHERE `Designer` = {designer|sql}
                        AND `Created Date` >= '{d0}' AND `Created Date` < '{d1_next}') c
        reference_dax: |
          EVALUATE
          CALCULATETABLE(ROW("Closing %", 100 * [Closing Rate], "Sold", [Projects Sold (Period)], "Created", [Projects Created (Period)]),
                         DATESBETWEEN(DateTable[Date], {d0_dax}, {d1_dax}), Salesforce_Data[Designer] = {designer|dax})

  - id: A08
    split: ambiguity
    source: rules section 8
    types: [appointments_sales]
    question: "What's our success rate?"
    franchises: [ICAU]
    answer_shape: rubric
    rubric:
      - "answers with one of the listed readings and names it, or asks"
      - "the number matches the reading it names"
    readings:
      - label: appointment success rate, all time under the franchise rule (rules, no period named)
        period: all_time
        result_columns: [Success Rate, Sold-Project Appointments, Appointments]
        col_types: {Success Rate: percent, Sold-Project Appointments: count, Appointments: count}
        reference_sql: |
          SELECT 100 * SUM(`Project Stage` = 'Sold') / COUNT(*) AS `Success Rate`, SUM(`Project Stage` = 'Sold') AS `Sold-Project Appointments`, COUNT(*) AS `Appointments`
          FROM Appointments WHERE {appt_rule_sql}
        reference_dax: |
          EVALUATE
          VAR _s = CALCULATE([Sold Project Count], {appt_rule_dax})
          VAR _a = CALCULATE([Total Activity Count], {appt_rule_dax})
          RETURN ROW("Success Rate", 100 * DIVIDE(_s, _a), "Sold-Project Appointments", _s, "Appointments", _a)
      - label: appointment success rate, year to date
        period: ytd
        result_columns: [Success Rate, Sold-Project Appointments, Appointments]
        col_types: {Success Rate: percent, Sold-Project Appointments: count, Appointments: count}
        reference_sql: *appt_success_sql
        reference_dax: *appt_success_dax
      - label: C1 closing rate, year to date
        period: ytd
        result_columns: [Closing %, Sold, Created]
        col_types: {Closing %: percent, Sold: count, Created: count}
        reference_sql: *c1_window_sql
        reference_dax: *c1_window_dax

  - id: A09
    split: ambiguity
    source: fresh
    types: []
    question: "How many active projects do we have?"
    franchises: [ICLA, ICCH]
    answer_shape: rubric
    rubric:
      - "answers with one of the listed readings and states it, or asks"
      - "the number matches the reading it names"
    readings:
      - label: open proposals (Revised Stage Proposed)
        period: all_time
        result_columns: [Projects, Amount]
        col_types: {Projects: count, Amount: currency}
        reference_sql: |
          SELECT COUNT(*) AS `Projects`, SUM(`Amount`) AS `Amount` FROM Salesforce_Data WHERE `Revised Stage` = 'Proposed'
        reference_dax: |
          EVALUATE ROW("Projects", [Count Proposed], "Amount", [Revenue Proposed])
      - label: sold but not yet complete (raw stage Ready to Order, Ready to Install or Incomplete)
        period: all_time
        result_columns: [Projects, Amount]
        col_types: {Projects: count, Amount: currency}
        reference_sql: |
          SELECT COUNT(*) AS `Projects`, SUM(`Amount`) AS `Amount` FROM Salesforce_Data
          WHERE `Stage` IN ('Ready to Order', 'Ready to Install', 'Incomplete')
        reference_dax: |
          EVALUATE ROW("Projects", CALCULATE(COUNTROWS(Salesforce_Data), Salesforce_Data[Stage] IN {"Ready to Order", "Ready to Install", "Incomplete"}) + 0,
                       "Amount", CALCULATE(SUM(Salesforce_Data[Amount]), Salesforce_Data[Stage] IN {"Ready to Order", "Ready to Install", "Incomplete"}))
      - label: projects created this year
        period: ytd
        result_columns: [Projects, Amount]
        col_types: {Projects: count, Amount: currency}
        reference_sql: |
          SELECT COUNT(*) AS `Projects`, SUM(`Amount`) AS `Amount` FROM Salesforce_Data WHERE `Created Date` >= '{d0}' AND `Created Date` < '{d1_next}'
        reference_dax: |
          EVALUATE ROW("Projects", CALCULATE([Count Total Projects], DATESBETWEEN(DateTable[Date], {d0_dax}, {d1_dax})),
                       "Amount", CALCULATE([Total Revenue], DATESBETWEEN(DateTable[Date], {d0_dax}, {d1_dax})))

