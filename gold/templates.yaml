  - &T042
    id: T042
    split: test
    source: prodlog
    types: [row_level_list, appointments_sales]
    question: "Which open proposals does {designer} have, and when was the last activity on each one?"
    franchises: [ICLA, ICCH, ICAU]
    params:
      designer:
        description: "designer with 3-30 open proposals (most first)"
        param_sql: |
          SELECT `Designer` FROM Salesforce_Data WHERE `Revised Stage` = 'Proposed'
          GROUP BY `Designer` HAVING COUNT(*) BETWEEN 3 AND 30
          ORDER BY COUNT(*) DESC, `Designer` LIMIT 1
    period: all_time
    date_basis: none
    answer_shape: table
    result_columns: [Project Name, Amount, Created Date, Last Activity]
    col_types: {Project Name: text, Amount: currency, Created Date: date, Last Activity: date}
    label_column: Project Name
    value_columns: [Amount]
    reference_sql: |
      SELECT s.`Project Name`, s.`Amount`, s.`Created Date`,
             (SELECT MAX(a.`Activity Date and Time`) FROM Appointments a WHERE a.`Project Name` = s.`Project Name`) AS `Last Activity`
      FROM Salesforce_Data s
      WHERE s.`Revised Stage` = 'Proposed' AND s.`Designer` = {designer|sql}
      ORDER BY s.`Created Date` DESC, s.`Project Name`
    reference_dax: |
      EVALUATE
      SELECTCOLUMNS(
        FILTER(Salesforce_Data, Salesforce_Data[Revised Stage] = "Proposed" && Salesforce_Data[Designer] = {designer|dax}),
        "Project Name", Salesforce_Data[Project Name], "Amount", Salesforce_Data[Amount],
        "Created Date", Salesforce_Data[Created Date],
        "Last Activity", VAR _p = Salesforce_Data[Project Name]
                         RETURN MAXX(FILTER(ALL(Appointments), Appointments[Project Name] = _p), Appointments[Activity Date and Time])
      )
      ORDER BY [Created Date] DESC, [Project Name]
    notes: "Pending / open = Revised Stage Proposed. Last activity = latest Appointments[Activity Date and Time] matched on Project Name (answering rule 7), any calendar entry or task, not Last Modified Date. Blank when the project has no activity."

