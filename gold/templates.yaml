        "Sold Amount", CALCULATE([Revenue Sold], DATESBETWEEN(DateTable[Date], {d0_dax}, {d1_dax}), Salesforce_Data[Lead Source Group] = "STOW"),
        "Sold Count", CALCULATE([Count Sold], DATESBETWEEN(DateTable[Date], {d0_dax}, {d1_dax}), Salesforce_Data[Lead Source Group] = "STOW")
      )
