  - id: T068
    split: test
    source: e2e170:Q046
    types: [appointments_rules]
    question: "What share of this year's appointments were design appointments?"
    franchises: [ICCH, ICAU]
    period: ytd
    date_basis: appointment_start
    answer_shape: number
    result_columns: [Design Share, Design Appointments, Appointments]
    col_types: {Design Share: percent, Design Appointments: count, Appointments: count}
    headline: [Design Share]
