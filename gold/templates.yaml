          WHERE `Revised Stage` = 'Sold' AND `Designer` = {designer|sql} AND {sales_date_sql} >= '{d0}' AND {sales_date_sql} < '{d1_next}'
        reference_dax: |
          EVALUATE
          ROW(
            "Sold Amount", CALCULATE([Revenue Sold], Salesforce_Data[Designer] = {designer|dax}, DATESBETWEEN({sales_cal_dax}[Date], {d0_dax}, {d1_dax})),
            "Sold Count", CALCULATE([Count Sold], Salesforce_Data[Designer] = {designer|dax}, DATESBETWEEN({sales_cal_dax}[Date], {d0_dax}, {d1_dax}))
          )

  - id: W04
    split: why_forecast
    source: plan
    types: [closing_rate]
    question: "Why is our closing rate lower than last year?"
    franchises: [ICLA]
    answer_shape: rubric
    rubric:
      - "uses the default closing rate (C1, Salesforce Community) for this year to date vs the same period last year, names the definition, and corrects the premise if it is not lower"
      - "walks the funnel (projects created, projects sold, leads) for both periods instead of guessing causes"
      - "any number given matches the facts"
    facts:
      - label: C1 closing rate, year to date vs the same period last year
        periods: {a: ytd, b: last_year_ytd}
        result_columns: [Closing % This Year, Closing % Same Period Last Year, Sold This Year, Created This Year, Sold Last Year, Created Last Year]
        col_types: {Closing % This Year: percent, Closing % Same Period Last Year: percent, Sold This Year: count, Created This Year: count, Sold Last Year: count, Created Last Year: count}
        reference_sql: |
          SELECT LEAST(100, 100 * t.sa / t.ca) AS `Closing % This Year`, LEAST(100, 100 * t.sb / t.cb) AS `Closing % Same Period Last Year`,
                 t.sa AS `Sold This Year`, t.ca AS `Created This Year`, t.sb AS `Sold Last Year`, t.cb AS `Created Last Year`
          FROM (SELECT SUM(`Revised Stage` = 'Sold' AND `Original Project Sold Date` >= '{a.d0}' AND `Original Project Sold Date` < '{a.d1_next}') AS sa,
                       SUM(`Created Date` >= '{a.d0}' AND `Created Date` < '{a.d1_next}') AS ca,
                       SUM(`Revised Stage` = 'Sold' AND `Original Project Sold Date` >= '{b.d0}' AND `Original Project Sold Date` < '{b.d1_next}') AS sb,
                       SUM(`Created Date` >= '{b.d0}' AND `Created Date` < '{b.d1_next}') AS cb
                FROM Salesforce_Data) t
        reference_dax: |
          EVALUATE
          VAR _a = CALCULATETABLE(ROW("r", [Closing Rate], "s", [Projects Sold (Period)], "c", [Projects Created (Period)]), DATESBETWEEN(DateTable[Date], {a.d0_dax}, {a.d1_dax}))
          VAR _b = CALCULATETABLE(ROW("r", [Closing Rate], "s", [Projects Sold (Period)], "c", [Projects Created (Period)]), DATESBETWEEN(DateTable[Date], {b.d0_dax}, {b.d1_dax}))
          RETURN ROW("Closing % This Year", 100 * MAXX(_a, [r]), "Closing % Same Period Last Year", 100 * MAXX(_b, [r]),
                     "Sold This Year", MAXX(_a, [s]), "Created This Year", MAXX(_a, [c]),
                     "Sold Last Year", MAXX(_b, [s]), "Created Last Year", MAXX(_b, [c]))

