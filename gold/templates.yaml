  - id: MT10-2
    split: multiturn
    conversation: MT10
    turn: 2
    source: fresh
    types: [appointments_sales, appointments_rules]
    question: "what share were for projects that sold?"
    resolved_question: "Appointment success rate year to date under Chicago's rule."
    franchises: [ICCH]
    period: ytd
    date_basis: appointment_start
    answer_shape: number
    result_columns: [Success Rate, Sold-Project Appointments, Appointments]
    col_types: {Success Rate: percent, Sold-Project Appointments: count, Appointments: count}
    headline: [Success Rate]
    reference_sql: &appt_success_sql |
      SELECT 100 * SUM(`Project Stage` = 'Sold') / COUNT(*) AS `Success Rate`,
             SUM(`Project Stage` = 'Sold') AS `Sold-Project Appointments`, COUNT(*) AS `Appointments`
      FROM Appointments
      WHERE {appt_rule_sql} AND `Appointment Start Time` >= '{d0}' AND `Appointment Start Time` < '{d1_next}'
    reference_dax: &appt_success_dax |
      EVALUATE
      VAR _s = CALCULATE([Sold Project Count], {appt_rule_dax},
                         KEEPFILTERS(Appointments[Appointment Start Time] >= {d0_dax}),
                         KEEPFILTERS(Appointments[Appointment Start Time] < {d1_next_dax}))
      VAR _a = CALCULATE([Total Activity Count], {appt_rule_dax},
                         KEEPFILTERS(Appointments[Appointment Start Time] >= {d0_dax}),
                         KEEPFILTERS(Appointments[Appointment Start Time] < {d1_next_dax}))
      RETURN ROW("Success Rate", 100 * DIVIDE(_s, _a), "Sold-Project Appointments", _s + 0, "Appointments", _a)

