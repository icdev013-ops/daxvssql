  - id: T070
    split: test
    source: fresh
    types: [appointments_rules, time_intelligence, ranking]
    question: "Which week this year had the most appointments?"
    franchises: [ICLA, ICCH]
    period: ytd
    date_basis: appointment_start
    answer_shape: ranked_list
    result_columns: [Week Start, Appointments]
