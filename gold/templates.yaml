          "Sold With Design Appointment", CALCULATE([Count Sold], DATESBETWEEN({sales_cal_dax}[Date], {d0_dax}, {d1_dax}), TREATAS(_p, Salesforce_Data[Project Name])) + 0,
          "Sold Projects", CALCULATE([Count Sold], DATESBETWEEN({sales_cal_dax}[Date], {d0_dax}, {d1_dax}))
        )
