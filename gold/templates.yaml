  - id: T028
    split: test
    source: e2e170:Q006
    types: [ranking, appointments_rules]
    question: "Which staff members ran the most appointments last month?"
    franchises: [ICCH, ICAU]
    period: last_month
    date_basis: appointment_start
    answer_shape: ranked_list
    result_columns: [Staff Member, Appointments]
    col_types: {Staff Member: text, Appointments: count}
    label_column: Staff Member
    value_columns: [Appointments]
    top_k: 5
    order_by: {column: Appointments, direction: desc, ties: either order accepted}
    reference_sql: |
      SELECT `Assigned Staff Member` AS `Staff Member`, COUNT(*) AS `Appointments`
      FROM Appointments
      WHERE {appt_rule_sql}
        AND `Appointment Start Time` >= '{d0}' AND `Appointment Start Time` < '{d1_next}'
        AND `Assigned Staff Member` IS NOT NULL AND `Assigned Staff Member` <> ''
      GROUP BY `Assigned Staff Member`
      ORDER BY `Appointments` DESC, `Staff Member`
    reference_dax: |
      EVALUATE
      VAR _t =
        ADDCOLUMNS(
          VALUES(Appointments[Assigned Staff Member]),
          "@n", CALCULATE([Total Activity Count], {appt_rule_dax},
                          KEEPFILTERS(Appointments[Appointment Start Time] >= {d0_dax}),
                          KEEPFILTERS(Appointments[Appointment Start Time] < {d1_next_dax}))
        )
      RETURN
        SELECTCOLUMNS(
          FILTER(_t, NOT ISBLANK([@n]) && NOT ISBLANK(Appointments[Assigned Staff Member])),
          "Staff Member", Appointments[Assigned Staff Member], "Appointments", [@n]
        )
      ORDER BY [Appointments] DESC, [Staff Member]
    notes: "Appointments under the franchise's report rule (macro appt_rule), period on Appointment Start Time."

